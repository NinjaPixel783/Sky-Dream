<style>
:root{--ink:#fff;--pink:#ff4fa3;--yel:#ffd23f;--cy:#3fe0ff;--grn:#5cf29a;--vio:#8b5cff;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.i{width:1.2em;height:1.2em;fill:currentColor;vertical-align:-.2em}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));background:rgba(6,12,32,.38);backdrop-filter:blur(5px);text-align:center;z-index:5}
.scr.on{display:flex}
h1{margin:0;font-size:clamp(44px,13vw,76px);line-height:.9;font-weight:700;letter-spacing:-.03em;background:linear-gradient(90deg,var(--pink),var(--yel),var(--grn),var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px rgba(0,0,0,.4))}
h2{margin:0;font-size:38px}
p{margin:0;opacity:.85}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-width:220px;padding:15px 26px;border:0;border-radius:22px;font:700 20px Fredoka,system-ui,sans-serif;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.28),0 12px 26px rgba(0,0,0,.3);transition:transform .12s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.b1{background:linear-gradient(135deg,#ff4fa3,#8b5cff)}
.b2{background:linear-gradient(135deg,#1fc8ff,#2ee59d)}
.b3{background:linear-gradient(135deg,#ffb020,#ff5c39)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:99px;background:rgba(5,15,40,.5);border:2px solid rgba(255,255,255,.2);font-weight:700;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(440px,100%);max-height:58vh;overflow:auto;padding:4px;touch-action:pan-y}
.card{border-radius:20px;padding:12px 4px;background:rgba(255,255,255,.13);border:3px solid rgba(255,255,255,.22);color:#fff;font:600 13px Fredoka,system-ui,sans-serif;cursor:pointer}
.card b{display:block;font-size:26px}
.card.sel{border-color:var(--yel);background:rgba(255,210,63,.2)}
.card.lock{opacity:.45}
.orb{width:48px;height:48px;border-radius:50%;margin:0 auto 6px;box-shadow:inset -5px -6px 10px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.3)}
#hud{position:fixed;left:0;right:0;top:0;display:none;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 0;z-index:4;pointer-events:none}
#hud.on{display:flex}
#hud .chip{padding:6px 12px;font-size:17px}
#bar{flex:1;height:14px;border-radius:9px;background:rgba(5,15,40,.5);border:2px solid rgba(255,255,255,.25);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--yel))}
#pb{pointer-events:auto;width:44px;height:44px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(5,15,40,.5);color:#fff;font-size:20px;cursor:pointer}
#bn{position:fixed;left:50%;top:26%;transform:translateX(-50%);font-size:clamp(24px,7vw,40px);font-weight:700;text-align:center;opacity:0;z-index:4;pointer-events:none;text-shadow:0 4px 20px rgba(0,0,0,.6)}
#bn.go{animation:bn 2.4s ease forwards}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-30px) scale(.8)}15%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
#snd{position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top,0px));width:44px;height:44px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(5,15,40,.5);color:#fff;font-size:20px;z-index:6;cursor:pointer}
.big{font-size:56px;font-weight:700;color:var(--yel);line-height:1}
@media(prefers-reduced-motion:reduce){#bn.go{animation-duration:.01s}}

/* ===== MENU PREMIUM ===== */
.menuShell{width:min(560px,100%);display:flex;flex-direction:column;align-items:center;gap:14px}.menuTop{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px}.profileMini{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);backdrop-filter:blur(18px);border-radius:18px;cursor:pointer;color:#fff}.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:linear-gradient(135deg,#4bdcff,#775cff);box-shadow:0 7px 20px rgba(50,150,255,.25)}.profileMini strong{font-size:15px;display:block}.profileMini small{opacity:.55}.quickStats{display:flex;gap:8px;width:100%;justify-content:center;flex-wrap:wrap}.menuActions{width:100%;display:grid;grid-template-columns:1.25fr 1fr;gap:10px}.menuActions .btn{width:100%;min-width:0}.menuSecondary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%}.miniBtn{padding:13px 8px;border:1px solid rgba(255,255,255,.15);border-radius:18px;background:rgba(255,255,255,.08);color:#fff;font:700 14px Fredoka;cursor:pointer;backdrop-filter:blur(16px)}.miniBtn:active{transform:scale(.97)}.profileCard,.settingsCard{width:min(520px,100%);padding:22px;border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.18);box-shadow:0 20px 70px rgba(0,0,0,.3);backdrop-filter:blur(22px)}.profileHero{display:flex;align-items:center;gap:16px;margin-bottom:18px}.avatarBig{width:78px;height:78px;border-radius:24px;display:grid;place-items:center;font-size:42px;background:linear-gradient(135deg,#3fe0ff,#8b5cff);box-shadow:0 15px 40px rgba(70,130,255,.3)}.field{display:flex;flex-direction:column;gap:7px;text-align:left;margin:12px 0}.field label{font-size:12px;text-transform:uppercase;letter-spacing:2px;opacity:.55}.field input{width:100%;padding:13px 15px;border-radius:15px;border:1px solid rgba(255,255,255,.18);outline:0;background:rgba(0,0,0,.2);color:#fff;font:600 16px Fredoka}.avatarChoices{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.avatarChoice{height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);font-size:23px;cursor:pointer}.avatarChoice.active{border-color:#fff;background:rgba(63,224,255,.2);box-shadow:0 0 0 2px rgba(63,224,255,.25)}.profileStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat{padding:12px;border-radius:17px;background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.1)}.stat b{display:block;font-size:22px}.stat span{font-size:11px;opacity:.5;text-transform:uppercase;letter-spacing:1px}.sectionTitle{width:100%;display:flex;justify-content:space-between;align-items:end}.sectionTitle h2{font-size:34px}.backBtn{align-self:flex-start;background:none;border:0;color:#fff;opacity:.7;font:700 14px Fredoka;cursor:pointer}.danger{background:rgba(255,80,90,.12);border-color:rgba(255,100,110,.2)}
@media(max-width:520px){.menuActions{grid-template-columns:1fr}.menuSecondary{grid-template-columns:repeat(3,1fr)}.avatarChoices{grid-template-columns:repeat(6,1fr)}}
</style>

<script>
/* Basé sur SKYDREAMS de Frank Force (JS1024 2026) — moteur 3D pseudo-perspective conservé,
   enrichi : niveaux, skins, pièces, SFX, musique, particules, UI mobile. */
'use strict';
const $=id=>document.getElementById(id),cv=$('cv'),c=cv.getContext('2d');
let W,H,dpr;
function rs(){dpr=Math.min(devicePixelRatio||1,1.5);W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr}
addEventListener('resize',rs);rs();

// ---------- sauvegarde ----------
let S={coins:0,best:0,unl:1,owned:[0],skin:0,mute:0,pseudo:'Sky Player',avatar:0,jumps:0,games:0,wins:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('skyd')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('skyd',JSON.stringify(S))}catch(e){}};

// nom, objectif, teinte ciel, teinte piste, vitesse, chance de trou, chance de case vide
const LV=[['Prairie céleste',400,200,120,.17,.05,.03],['Océan de nuages',700,215,175,.19,.07,.05],['Crépuscule',1000,280,320,.21,.09,.07],['Aurore rose',1400,330,190,.23,.11,.09],['Tempête solaire',1900,20,50,.25,.13,.11],['Infini arc-en-ciel',1e9,0,0,.2,.12,.10]];
const SK=[['Bulle',0,'#7fe9ff','#1466ff'],['Bonbon',30,'#ff9ad0','#d1146f'],['Menthe',60,'#b6ffd6','#0aa86b'],['Lave',90,'#ffd166','#e01e1e'],['Galaxie',130,'#c9a6ff','#2a0a6b'],['Or',190,'#fff3a0','#c98a00'],['Glace',260,'#ffffff','#7aa7d9'],['Arc-en-ciel',400]];

// ---------- audio ----------
let ac,mg,sg,mu,mstep=0,nt=0;
let music=new Audio('music.mp3');
music.loop=true;
let gameOverSound=new Audio('gameover.mp3');
gameOverSound.preload='auto';
gameOverSound.volume=.75;
music.preload='auto';
music.volume=.55;

const mf=n=>440*2**((n-69)/12);

function setVol(){
  if(ac){
    mg.gain.value=S.mute?0:.48;
    sg.gain.value=S.mute?0:.62;
  }
  music.volume=S.mute?0:.55;
}

function initA(){
  if(ac){
    if(ac.state==='suspended')ac.resume();
    setVol();
    music.play().catch(()=>{});
    return;
  }

  try{
    ac=new(window.AudioContext||window.webkitAudioContext)();

    mg=ac.createGain();
    sg=ac.createGain();

    mg.connect(ac.destination);
    sg.connect(ac.destination);

    mu=ac.createGain();
    mu.gain.value=.72;

    const f=ac.createBiquadFilter();
    f.type='lowpass';
    f.frequency.value=5600;
    f.Q.value=.45;

    mu.connect(f);
    f.connect(mg);

    setVol();
    setVol();
    music.play().catch(()=>{});
  }catch(e){}
}

function tone(f,t,d,ty,v,dst,f2){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=ty;
  o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);
  g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);
  g.connect(dst);
  o.start(t);
  o.stop(t+d+.02);
}

/*
  Arcade platform music originale.
  Tempo rapide (~170 BPM), basse rebondissante,
  mélodie accrocheuse et accents rétro.
  Inspiration générale : jeux de plateforme rapides
  et musique arcade 16/32-bit, sans reprendre une mélodie existante.
*/

const CH=[
  [60,64,67,72], // C
  [57,60,64,69], // Am
  [53,57,60,65], // F
  [55,59,62,67]  // G
];

const LEAD=[
  [72,76,79,76,74,76,84,81,79,76,74,72,76,79,84,81],
  [69,72,76,79,76,72,74,76,81,79,76,72,69,72,76,79],
  [72,74,77,81,79,77,74,72,76,79,81,84,81,79,77,74],
  [79,83,86,83,81,79,76,79,81,83,86,88,86,83,81,79]
];

const BASS=[
  [36,36,43,36,48,43,36,43],
  [33,33,40,33,45,40,33,40],
  [29,29,36,29,41,36,29,36],
  [31,31,38,31,43,38,31,38]
];

function sched(){
  if(!ac||ac.state!=='running')return;

  while(nt<ac.currentTime+.35){

    const step=mstep&15;
    const bar=(mstep>>4)&3;
    const lead=LEAD[bar];
    const bass=BASS[bar];
    const ch=CH[bar];

    // Mélodie principale : brillante et très rythmée
    tone(
      mf(lead[step]),
      nt,
      .145,
      'square',
      .075,
      mu
    );

    // Double octave sur les réponses
    if(step===3||step===7||step===11||step===15){
      tone(
        mf(lead[step]+12),
        nt+.018,
        .095,
        'triangle',
        .045,
        mu
      );
    }

    // Petite réponse de synthé sur les contretemps
    if(step===5||step===13){
      tone(
        mf(lead[(step+1)&15]-12),
        nt+.055,
        .09,
        'square',
        .035,
        mu
      );
    }

    // Basse sautillante
    tone(
      mf(bass[step&7]),
      nt,
      .17,
      'sawtooth',
      .135,
      mu,
      mf(bass[step&7]+5)
    );

    // Kick synthétique
    if(step===0||step===4||step===8||step===12){
      tone(105,nt,.10,'sine',.27,sg,52);
    }

    // Snare / clap synthétique
    if(step===4||step===12){
      tone(185,nt,.055,'square',.06,sg,110);
      tone(720,nt,.035,'triangle',.045,sg);
    }

    // Hi-hat arcade très léger
    if(step%2===0){
      tone(1500,nt,.025,'square',.018,sg);
    }

    // Accord d'ouverture de chaque phrase
    if(step===0){
      ch.forEach((n,i)=>{
        tone(mf(n+12),nt+i*.014,.34,'triangle',.022,mu);
      });
    }

    // Petite montée de fin de phrase
    if(step===14){
      tone(mf(lead[15]+12),nt+.055,.08,'square',.035,mu);
    }

    mstep++;
    // ~170 BPM : 16e de note
    nt+=.0882;
  }
}

function sfx(n){
  if(!ac||S.mute)return;
  const t=ac.currentTime;

  if(n=='j')
    tone(330,t,.13,'square',.34,sg,760);

  if(n=='l')
    tone(175,t,.13,'sine',.46,sg,60);

  if(n=='c'){
    tone(880,t,.07,'square',.13,sg);
    tone(1320,t+.055,.14,'square',.13,sg);
  }

  if(n=='f'){
    tone(520,t,.55,'sawtooth',.16,sg,58);
  }

  if(n=='w'){
    [523,659,784,988,1175,1319].forEach((f,i)=>{
      tone(f,t+i*.075,.24,'triangle',.32,sg);
    });
  }

  if(n=='u')
    tone(700,t,.06,'square',.08,sg);
}
// ---------- monde ----------
let st='menu',lv=Math.min(S.unl,LV.length)-1,x=0,y=0,z=0,vy=0,tx=0,jb=0,T=0,run=0,shake=0,falling=0,parts=[];
let rows=[],gap=0,sx=3,sw=3;
const keys={};
function gen(n){
  const L=LV[lv];
  while(rows.length<=n){
    const i=rows.length;
    if(gap<-8&&Math.random()<L[5])gap=2+Math.min(3,lv*.7+i/500)|0;
    if(Math.random()<.1){sw=2+Math.random()*3|0;sx=Math.max(0,Math.min(7-sw,sx-2+Math.random()*5|0))}
    gap--;
    const r=[];
    for(let j=0;j<7;j++){
      const on=gap<0&&sx<=j&&j<sx+sw;
      const t=i<35||Math.random()>.9||(on&&Math.random()>L[6]);
      r[j]=t?(i>=8&&on&&Math.random()<.07?2:1):0;
    }
    rows[i]=r;
  }
}
const P=(a,b,d)=>{const k=H*.7/d;return[W/2+(a-x+(d-3)**2/50*Math.cos((z+d)/49))*k,H/2-(b-2+d*d/50)*k,k]};
const hsl=(h,s,l,a=1)=>c.fillStyle=`hsl(${h},${s}%,${l}%,${a})`;
const skc=()=>{const s=SK[S.skin];return[s[2]||`hsl(${z*3%360},90%,65%)`,s[3]||`hsl(${(z*3+50)%360},90%,40%)`]};

function burst(n,col,sp,up){
  const[a,b,k]=P(x,Math.max(y,0)+.1,3);
  for(let i=0;i<n&&parts.length<250;i++){const an=Math.random()*6.28,v=Math.random()*sp*k*.02;
    parts.push({x:a,y:b,vx:Math.cos(an)*v,vy:Math.sin(an)*v-(up?k*.012:0),l:30+Math.random()*20,m:50,c:col,s:(2+Math.random()*3)*dpr})}
}

// ---------- logique ----------
function stepG(){
  T++;
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.03*dpr;p.l--}
  parts=parts.filter(p=>p.l>0);
  shake*=.9;
  if(st==='menu'){z+=.1;return}
  if(st!=='play')return;
  const L=LV[lv];
  if(keys.l)tx-=.16;if(keys.r)tx+=.16;
  tx=Math.max(-3.5,Math.min(3.5,tx));x+=(tx-x)*.3;
  gen(z+45|0);
  y+=vy-=.006;if(jb>0)jb--;
  z+=Math.min(.5,L[4]+z/6000);
  const ri=(z+3)|0,ci=Math.round(x+3),cell=rows[ri][ci];
  if(y<0&&y>-.3&&cell){
    const hit=vy<-.03;y=0;
    if(jb>0){vy=.11;jb=0;sfx('j');burst(8,skc()[0],4,0)}
    else{vy=0;if(hit){sfx('l');shake=3;burst(10,'#fff',5,1)}}
  }
  if(cell==2&&y>-.4&&y<1.2&&Math.abs(x-(ci-3))<.65){
    rows[ri][ci]=1;run++;sfx('c');burst(14,'#ffd23f',7,1);
  }
  if(T%2==0){const[a,b,k]=P(x,y+.3,3);parts.push({x:a,y:b,vx:0,vy:0,l:22,m:22,c:skc()[0],s:k*.16})}
  if(y<-.3&&!falling){falling=1;sfx('f')}
  if(y<-4)return endRun(0);
  if(z>=L[1])return endRun(1);
  if(T%4==0){$('sc').textContent=z|0;$('cn').textContent=S.coins+run;$('bf').style.width=Math.min(100,z/L[1]*100)+'%'}
}

// ---------- rendu ----------
function draw(){
  const L=LV[lv],inf=lv==LV.length-1,h=(L[2]+(inf?z*.15:0))%360,th=(L[3]+(inf?z*.15:0))%360;
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;
  c.save();if(shake>.5)c.translate((Math.random()-.5)*shake*dpr,(Math.random()-.5)*shake*dpr);
  gen(z+45|0);
  const g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`hsl(${h+40},65%,16%)`);g.addColorStop(.55,`hsl(${h},70%,52%)`);g.addColorStop(1,`hsl(${h-40},85%,72%)`);
  c.fillStyle=g;c.fillRect(-20,-20,W+40,H+40);
  c.fillStyle='#fff';
  for(let i=1;i<70;i++){const s=(i%3+1)*dpr;c.globalAlpha=.4+.5*Math.abs(Math.sin(T*.02+i));c.fillRect((i*i*37+z*i*.3)%W,(i**3.3)%(H*.55),s,s)}
  c.globalAlpha=1;
  const sg2=c.createRadialGradient(W*.5,H*.36,0,W*.5,H*.36,H*.32);
  sg2.addColorStop(0,`hsla(${h+30},100%,88%,.9)`);sg2.addColorStop(1,`hsla(${h+30},100%,70%,0)`);
  c.fillStyle=sg2;c.fillRect(0,0,W,H);
  // piste
  const r0=z+40|0;
  for(let r=r0;r>z;r--){
    const d=r-z;c.globalAlpha=Math.min(1,(41-d)/10);
    for(let pass=2;pass--;)for(let i=7;i--;){
      const cell=rows[r][i];if(!cell)continue;
      const[ax,ay]=P(i-3.5,0,d),[bx,by]=P(i-2.5,0,d),[ex,ey]=P(i-3.5,0,d+1),[fx,fy]=P(i-2.5,0,d+1),hh=(th+(r>>6)*40)%360,par=(r+i)&1;
      if(pass){hsl(hh,60,32+par*9);c.fillRect(ex,ey,fx-ex,(40-d)/30*H)}
      else{
        hsl(hh,60,12+par*5);c.fillRect(ax,ay,bx-ax,(40-d)/30*H);
        hsl(hh,65,58+par*20);c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.lineTo(fx,fy);c.lineTo(ex,ey);c.closePath();c.fill();
        if(cell==2){
          const[cx,cy,k]=P(i-3,.55+.08*Math.sin(T*.1+r),d),rad=k*.16;
          c.fillStyle='#ffd23f';c.beginPath();c.ellipse(cx,cy,Math.max(rad*.12,rad*Math.abs(Math.cos(T*.06+r))),rad,0,0,7);c.fill();
          c.strokeStyle='#fff6b0';c.lineWidth=2*dpr;c.stroke();
        }
      }
    }
  }
  c.globalAlpha=1;
  // balle
  if(st!=='menu'){
    if(y>=0&&rows[z+3|0][Math.round(x+3)]){const[a,b,k]=P(x,0,3);c.fillStyle='rgba(0,0,0,.45)';c.beginPath();c.ellipse(a,b,k/4,k/9,0,0,7);c.fill()}
    const[a,b,k]=P(x,y+.35,3),R=k*.33,[c1,c2]=skc();
    c.globalAlpha=.25;c.fillStyle=c1;c.beginPath();c.arc(a,b,R*1.5,0,7);c.fill();c.globalAlpha=1;
    const bg=c.createRadialGradient(a-R*.35,b-R*.4,R*.08,a,b,R);
    bg.addColorStop(0,'#fff');bg.addColorStop(.3,c1);bg.addColorStop(1,c2);
    c.fillStyle=bg;c.beginPath();c.arc(a,b,R,0,7);c.fill();
  }
  // particules
  for(const p of parts){c.globalAlpha=p.l/p.m;c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.s*(p.l/p.m),0,7);c.fill()}
  c.globalAlpha=1;c.restore();
}
let last=0,acc=0;
function loop(t){requestAnimationFrame(loop);acc=Math.min(acc+t-last,100);last=t;while(acc>=16.67){stepG();acc-=16.67}draw()}
requestAnimationFrame(loop);

// ---------- écrans ----------
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id))}
function banner(t){const b=$('bn');b.textContent=t;b.classList.remove('go');void b.offsetWidth;b.classList.add('go')}
function resetWorld(){rows=[];gap=0;sx=sw=3;x=y=z=vy=tx=0;falling=0;parts=[]}
function start(l){
  lv=l;resetWorld();run=0;jb=0;S.games=(S.games||0)+1;st='play';show('');$('hud').classList.add('on');
  $('bf').style.width='0';$('sc').textContent='0';$('cn').textContent=S.coins;
  banner('Niveau '+(l+1)+' · '+LV[l][0]);
}
function endRun(w){
  st=w?'win':'over';const bonus=w?lv*15+30:0;
  S.coins+=run+bonus;const d=z|0;if(d>S.best)S.best=d;
  if(w){S.wins=(S.wins||0)+1;S.unl=Math.max(S.unl,Math.min(lv+2,LV.length));}
  save();$('hud').classList.remove('on');
  if(w){$('wc').textContent=run+bonus;$('nx').style.display=lv<LV.length-1?'flex':'none';sfx('w');burst(60,'#ffd23f',10,1);show('win')}
  else{
    $('fs').textContent=d;
    $('fc').textContent=run;
    $('fb').textContent=S.best;
    if(!S.mute){gameOverSound.currentTime=0;gameOverSound.play().catch(()=>{});}
    show('over');
  }
}
const AVATARS=['🚀','🪐','👾','🌙','⚡','🦊','🐉','😎','🤖','👻','⭐','🔥'];
function renderProfile(){
  $('mp').textContent=S.pseudo||'Sky Player'; $('ma').textContent=AVATARS[S.avatar||0];
  $('pp').textContent=S.pseudo||'Sky Player'; $('pa').textContent=AVATARS[S.avatar||0];
  $('pseudoInput').value=S.pseudo||'Sky Player'; $('psBest').textContent=S.best|0; $('psCoins').textContent=S.coins|0; $('psWins').textContent=S.wins|0;
  $('mu').textContent=S.unl|0; $('mw').textContent=S.wins|0;
  $('avatarChoices').innerHTML=AVATARS.map((a,i)=>`<button class="avatarChoice ${i===(S.avatar||0)?'active':''}" data-avatar="${i}">${a}</button>`).join('');
  $('soundLabel').textContent=S.mute?'Son désactivé':'Son activé'; $('settingsSnd').setAttribute('href',S.mute?'#i-mute':'#i-snd');
}
function saveProfile(){const v=$('pseudoInput').value.trim();S.pseudo=v||'Sky Player';save();renderProfile();show('menu');banner('Profil enregistré');}
function resetProfile(){if(!confirm('Réinitialiser la progression et le profil ?'))return;S={coins:0,best:0,unl:1,owned:[0],skin:0,mute:S.mute,pseudo:'Sky Player',avatar:0,jumps:0,games:0,wins:0};save();buildShop();renderProfile();menu();}
function menu(){st='menu';lv=Math.min(lv,S.unl-1);resetWorld();$('hud').classList.remove('on');$('mb').textContent=S.best;$('mc').textContent=S.coins;renderProfile();show('menu')}
function buildLevels(){
  $('lg2').innerHTML=LV.map((l,i)=>`<button class="card ${i<S.unl?'':'lock'}" data-l="${i}"><b>${i<S.unl?i+1:'<svg class="i"><use href="#i-lock"/></svg>'}</b>${l[0]}</button>`).join('');
}
function buildShop(){
  $('sc2').textContent=S.coins;
  $('sg').innerHTML=SK.map((s,i)=>{
    const own=S.owned.includes(i),bg=s[2]?`radial-gradient(circle at 35% 30%,#fff,${s[2]} 35%,${s[3]})`:'conic-gradient(#ff4fa3,#ffd23f,#5cf29a,#3fe0ff,#8b5cff,#ff4fa3)';
    return `<button class="card ${S.skin==i?'sel':''} ${own?'':'lock'}" data-s="${i}"><div class="orb" style="background:${bg}"></div>${s[0]}<br>${own?(S.skin==i?'Équipée':'Choisir'):`<svg class="i"><use href="#i-coin"/></svg> ${s[1]}`}</button>`;
  }).join('');
}
function togglePause(){
  if(st==='play'){st='pause';show('pauseS')}
  else if(st==='pause'){st='play';show('')}
}
function act(a){
  if(a=='play')start(lv);
  else if(a=='levels'){buildLevels();show('levels')}
  else if(a=='shop'){buildShop();show('shop')}
  else if(a=='profile'){renderProfile();show('profile')}
  else if(a=='settings'){renderProfile();show('settings')}
  else if(a=='saveProfile'){saveProfile()}
  else if(a=='resetProfile'){resetProfile()}
  else if(a=='menu')menu();
  else if(a=='retry')start(lv);
  else if(a=='next')start(lv+1);
  else if(a=='pause')togglePause();
  else if(a=='snd'){S.mute^=1;setVol();save();$('sndU').setAttribute('href',S.mute?'#i-mute':'#i-snd')}
}
document.addEventListener('click',e=>{
  const av=e.target.closest('[data-avatar]');
  if(av){S.avatar=+av.dataset.avatar;renderProfile();sfx('u');return;}
  const b=e.target.closest('[data-a],[data-l],[data-s]');if(!b)return;sfx('u');
  if(b.dataset.a)act(b.dataset.a);
  else if(b.dataset.l!==undefined){const l=+b.dataset.l;if(l<S.unl)start(l)}
  else{
    const i=+b.dataset.s,s=SK[i];
    if(S.owned.includes(i))S.skin=i;
    else if(S.coins>=s[1]){S.coins-=s[1];S.owned.push(i);S.skin=i;sfx('c')}
    save();buildShop();
  }
});
$('sndU').setAttribute('href',S.mute?'#i-mute':'#i-snd');
menu();

// ---------- contrôles ----------
let dn=null;
addEventListener('pointerdown',e=>{
  initA();
  if(st!=='play'||e.target.closest('button'))return;
  dn={t:performance.now(),lx:e.clientX,m:0};
  if(e.pointerType==='mouse')jb=10;
});
addEventListener('pointermove',e=>{
  if(st!=='play')return;
  if(e.pointerType==='mouse')tx=(e.clientX/innerWidth-.5)*8;
  else if(dn){const d=e.clientX-dn.lx;tx+=d/innerWidth*9;dn.m+=Math.abs(d);dn.lx=e.clientX}
});
addEventListener('pointerup',e=>{
  if(dn&&e.pointerType!=='mouse'&&dn.m<14&&performance.now()-dn.t<300)jb=10;
  dn=null;
});
addEventListener('keydown',e=>{
  initA();const k=e.key;
  if(k=='a'||k=='ArrowLeft')keys.l=1;
  if(k=='d'||k=='ArrowRight')keys.r=1;
  if(k==' '||k=='ArrowUp'||k=='w'){jb=10;e.preventDefault()}
  if(k=='p'||k=='Escape')togglePause();
  if(k=='r'&&(st=='play'||st=='over'))start(lv);
});
addEventListener('keyup',e=>{const k=e.key;if(k=='a'||k=='ArrowLeft')keys.l=0;if(k=='d'||k=='ArrowRight')keys.r=0});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st==='play')togglePause()});
</script>
