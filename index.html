<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SkyDreams — Endless Sky</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
  /* =========================================================
   SKYDREAMS — MOBILE UI
   ========================================================= */

:root{
  --glass:rgba(7,18,42,.58);
  --glass2:rgba(255,255,255,.12);
  --stroke:rgba(255,255,255,.22);
  --shadow:0 12px 35px rgba(0,0,0,.35);
}

/* HUD amélioré */
#hud{
  padding:
    calc(12px + env(safe-area-inset-top,0px))
    max(14px,env(safe-area-inset-right,0px))
    0
    max(14px,env(safe-area-inset-left,0px));
  gap:10px;
  transition:transform .25s ease,opacity .25s ease;
}

#hud .chip{
  min-height:44px;
  padding:7px 13px;
  border-radius:16px;
  background:rgba(5,15,40,.62);
  border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:0 8px 25px rgba(0,0,0,.18);
}

#bar{
  height:13px;
  border-radius:99px;
  background:rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.3);
}

#bar i{
  border-radius:99px;
  box-shadow:0 0 12px rgba(255,210,63,.55);
  transition:width .12s linear;
}

#pb{
  width:46px;
  height:46px;
  flex:none;
  background:rgba(5,15,40,.68);
  backdrop-filter:blur(12px);
  box-shadow:0 8px 20px rgba(0,0,0,.25);
}

/* =========================================================
   MOBILE CONTROLS
   ========================================================= */

#mobileControls{
  position:fixed;
  inset:0;
  z-index:7;
  pointer-events:none;
  display:none;
  overflow:hidden;
}

#mobileControls.active{
  display:block;
}

/* joystick */
#movePad{
  position:absolute;
  left:max(18px,env(safe-area-inset-left));
  bottom:max(22px,env(safe-area-inset-bottom));
  width:145px;
  height:145px;
  pointer-events:auto;
  touch-action:none;
}

.pad-ring{
  position:absolute;
  inset:0;
  border-radius:50%;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(255,255,255,.18),
      rgba(255,255,255,.07) 45%,
      rgba(5,15,40,.52) 70%
    );

  border:2px solid rgba(255,255,255,.25);

  box-shadow:
    inset 0 0 25px rgba(255,255,255,.06),
    0 12px 35px rgba(0,0,0,.3);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.pad-ring::before{
  content:"";
  position:absolute;
  inset:18px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.12);
}

#padKnob{
  position:absolute;
  width:62px;
  height:62px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 28%,
      #fff,
      #72e8ff 24%,
      #477cff 65%,
      #7b35ff
    );

  border:3px solid rgba(255,255,255,.65);

  box-shadow:
    0 5px 18px rgba(0,0,0,.35),
    0 0 20px rgba(72,180,255,.35);

  transition:transform .07s ease;
}

.pad-arrow{
  position:absolute;
  color:rgba(255,255,255,.25);
  font-size:13px;
  pointer-events:none;
}

.pad-arrow.up{
  top:8px;
  left:50%;
  transform:translateX(-50%);
}

.pad-arrow.down{
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
}

.pad-arrow.left{
  left:9px;
  top:50%;
  transform:translateY(-50%);
}

.pad-arrow.right{
  right:9px;
  top:50%;
  transform:translateY(-50%);
}

/* bouton saut */
#jumpBtn{
  position:absolute;
  right:max(25px,env(safe-area-inset-right));
  bottom:max(30px,env(safe-area-inset-bottom));

  width:92px;
  height:92px;

  border-radius:50%;
  border:3px solid rgba(255,255,255,.42);

  background:
    radial-gradient(
      circle at 35% 25%,
      #fff,
      #ffd23f 25%,
      #ff8b24 60%,
      #ff4f6d
    );

  color:white;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 8px 0 rgba(130,40,20,.45),
    0 15px 35px rgba(0,0,0,.35),
    0 0 30px rgba(255,160,40,.25);

  pointer-events:auto;
  touch-action:none;
  cursor:pointer;

  transition:
    transform .08s ease,
    filter .15s ease;
}

#jumpBtn span{
  font-size:42px;
  font-weight:700;
  line-height:30px;
  text-shadow:0 3px 8px rgba(0,0,0,.25);
}

#jumpBtn small{
  font:700 10px Fredoka,system-ui,sans-serif;
  letter-spacing:.12em;
  opacity:.9;
}

#jumpBtn:active,
#jumpBtn.pressed{
  transform:translateY(6px) scale(.94);
  box-shadow:
    0 2px 0 rgba(130,40,20,.45),
    0 8px 18px rgba(0,0,0,.3);
  filter:brightness(1.12);
}

/* pause mobile */
#mobilePause{
  position:absolute;
  right:max(15px,env(safe-area-inset-right));
  top:calc(72px + env(safe-area-inset-top));

  width:48px;
  height:48px;

  border-radius:16px;
  border:1px solid rgba(255,255,255,.25);

  color:#fff;
  background:rgba(5,15,40,.55);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  box-shadow:var(--shadow);

  pointer-events:auto;
  cursor:pointer;

  display:none;
}

#mobileControls.active #mobilePause{
  display:flex;
  align-items:center;
  justify-content:center;
}

/* message tutoriel */
#mobileHint{
  position:absolute;
  left:50%;
  bottom:190px;

  transform:translateX(-50%) translateY(15px);

  display:flex;
  align-items:center;
  gap:9px;

  padding:11px 17px;

  border-radius:99px;

  background:rgba(5,15,40,.65);
  border:1px solid rgba(255,255,255,.2);

  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);

  box-shadow:0 10px 30px rgba(0,0,0,.25);

  font-size:14px;

  opacity:0;
  pointer-events:none;

  transition:
    opacity .3s ease,
    transform .3s ease;
}

#mobileHint.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

#mobileHint span{
  font-size:20px;
}

/* feedback tactile */
#touchFeedback{
  position:fixed;
  width:45px;
  height:45px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.5);
  pointer-events:none;
  z-index:20;
  opacity:0;
  transform:translate(-50%,-50%) scale(.5);
}

#touchFeedback.show{
  animation:touchPulse .35s ease-out;
}

@keyframes touchPulse{
  0%{
    opacity:.8;
    transform:translate(-50%,-50%) scale(.5);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.5);
  }
}

/* =========================================================
   MENUS
   ========================================================= */

.scr{
  padding:
    calc(22px + env(safe-area-inset-top,0px))
    max(18px,env(safe-area-inset-right))
    calc(22px + env(safe-area-inset-bottom,0px))
    max(18px,env(safe-area-inset-left));

  background:
    radial-gradient(
      circle at 50% 30%,
      rgba(80,180,255,.13),
      transparent 45%
    ),
    rgba(6,12,32,.48);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.scr.on{
  animation:screenIn .3s ease;
}

@keyframes screenIn{
  from{
    opacity:0;
    transform:scale(1.025);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

h1{
  font-size:clamp(52px,14vw,80px);
  text-shadow:
    0 8px 25px rgba(0,0,0,.3);
}

h2{
  font-size:clamp(34px,9vw,48px);
  text-shadow:0 5px 20px rgba(0,0,0,.3);
}

/* boutons */
.btn{
  min-width:min(300px,88vw);
  min-height:58px;
  padding:15px 24px;

  border-radius:20px;

  border:1px solid rgba(255,255,255,.15);

  position:relative;
  overflow:hidden;

  box-shadow:
    0 7px 0 rgba(0,0,0,.25),
    0 15px 30px rgba(0,0,0,.28);

  transition:
    transform .1s ease,
    filter .15s ease;
}

.btn::after{
  content:"";
  position:absolute;
  inset:0;

  background:linear-gradient(
    120deg,
    transparent 20%,
    rgba(255,255,255,.18) 50%,
    transparent 80%
  );

  transform:translateX(-120%);
  transition:transform .45s ease;
}

.btn:hover::after{
  transform:translateX(120%);
}

.btn:hover{
  filter:brightness(1.08);
  transform:translateY(-2px);
}

.btn:active{
  transform:translateY(5px) scale(.98);
}

/* cartes */
.card{
  min-height:105px;

  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.16),
      rgba(255,255,255,.06)
    );

  border:2px solid rgba(255,255,255,.15);

  box-shadow:
    0 8px 22px rgba(0,0,0,.18);

  transition:
    transform .15s ease,
    border-color .15s ease,
    background .15s ease;
}

.card:active{
  transform:scale(.95);
}

.card.sel{
  border-color:#ffd23f;
  box-shadow:
    0 0 0 2px rgba(255,210,63,.15),
    0 8px 25px rgba(255,180,40,.2);
}

/* boutique */
.orb{
  width:55px;
  height:55px;
  border:2px solid rgba(255,255,255,.35);
}


/* =========================================================
   SKYDREAMS — ARCADE BUTTONS / MENU REFRESH
   ========================================================= */
.menuBall{
  width:126px;height:126px;border-radius:50%;position:relative;
  margin:0 0 2px;display:grid;place-items:center;
  transform:translateZ(0);
  animation:menuBallFloat 2.8s ease-in-out infinite;
  filter:drop-shadow(0 18px 22px rgba(0,0,0,.3));
}
.menuBall::before{
  content:"";position:absolute;inset:-13px;border-radius:50%;
  background:conic-gradient(from 0deg,#ff4fa3,#ffd23f,#5cf29a,#3fe0ff,#8b5cff,#ff4fa3);
  opacity:.5;filter:blur(10px);animation:menuBallSpin 5s linear infinite;
}
.menuBall::after{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  border:4px solid rgba(255,255,255,.5);
  box-shadow:inset 0 4px 8px rgba(255,255,255,.35),0 0 20px rgba(255,255,255,.2);
}
.menuBall .ballCore{
  width:100%;height:100%;border-radius:50%;position:relative;z-index:2;
  background:radial-gradient(circle at 30% 24%,#fff 0 8%,var(--ball1,#8eeaff) 27%,var(--ball2,#062c7a) 78%,#030816 100%);
  box-shadow:inset -14px -17px 25px rgba(0,0,0,.28),inset 8px 7px 16px rgba(255,255,255,.22),0 9px 18px rgba(0,0,0,.28);
  overflow:hidden;
}
.menuBall .ballCore::before{
  content:"";position:absolute;left:10%;right:10%;top:40%;height:12%;border-radius:50%;
  background:rgba(255,255,255,.2);transform:rotate(-18deg);filter:blur(2px);
}
.menuBall .ballCore::after{
  content:"";position:absolute;width:25px;height:25px;left:24px;top:19px;border-radius:50%;
  background:rgba(255,255,255,.72);filter:blur(1px);
}
.menuBall .ballRing{
  position:absolute;inset:20%;border:3px solid rgba(255,255,255,.42);border-left-color:transparent;
  border-radius:50%;transform:rotate(-24deg);animation:menuRingSpin 2.4s linear infinite;
}
.menuBall .ballStar{
  position:absolute;right:17px;bottom:18px;color:#fff;font-size:22px;opacity:.8;
  text-shadow:0 0 10px currentColor;animation:starPulse 1.6s ease-in-out infinite;
}
@keyframes menuBallFloat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9px) rotate(4deg)}}
@keyframes menuBallSpin{to{transform:rotate(360deg)}}
@keyframes menuRingSpin{to{transform:rotate(336deg)}}
@keyframes starPulse{0%,100%{transform:scale(.85);opacity:.55}50%{transform:scale(1.12);opacity:1}}

.menuLogoTitle{
  margin-top:2px!important;
  font-size:clamp(46px,12vw,76px)!important;
  letter-spacing:-.055em!important;
  background:linear-gradient(180deg,#fff 0%,#dff8ff 26%,#65dfff 55%,#8b5cff 100%)!important;
  -webkit-background-clip:text!important;background-clip:text!important;color:transparent!important;
  text-shadow:none!important;
  filter:drop-shadow(0 7px 0 rgba(40,31,120,.5)) drop-shadow(0 12px 20px rgba(0,0,0,.3))!important;
}
.menuTag{font-size:15px!important;font-weight:700;letter-spacing:.04em;opacity:.9!important}

.btn{
  position:relative;isolation:isolate;overflow:hidden;
  min-width:min(300px,88vw)!important;min-height:62px!important;padding:12px 25px!important;
  border:2px solid rgba(255,255,255,.34)!important;border-radius:20px!important;
  font:700 21px Fredoka,system-ui,sans-serif!important;
  letter-spacing:.015em;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -5px 0 rgba(0,0,0,.14),0 7px 0 rgba(43,19,94,.42),0 14px 25px rgba(0,0,0,.28)!important;
  transform:translateY(0);transition:transform .12s ease,filter .15s ease,box-shadow .12s ease!important;
}
.btn::before{
  content:"";position:absolute;left:7%;right:7%;top:6px;height:22%;border-radius:99px;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.45),rgba(255,255,255,0));
  z-index:-1;pointer-events:none;
}
.btn::after{
  content:"";position:absolute;inset:-30%;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.32) 50%,transparent 58%);
  transform:translateX(-75%) rotate(8deg);transition:transform .55s ease;z-index:-1;pointer-events:none;
}
.btn:hover{transform:translateY(-2px) scale(1.015);filter:brightness(1.08);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -5px 0 rgba(0,0,0,.14),0 9px 0 rgba(43,19,94,.42),0 18px 30px rgba(0,0,0,.3)!important}
.btn:hover::after{transform:translateX(75%) rotate(8deg)}
.btn:active{transform:translateY(6px) scale(.975)!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.12),0 2px 0 rgba(43,19,94,.42),0 8px 15px rgba(0,0,0,.24)!important}
.btn .btnIcon{width:30px;height:30px;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.b1{background:linear-gradient(180deg,#ff73c0 0%,#ff4fa3 44%,#b82fff 100%)!important}
.b2{background:linear-gradient(180deg,#55e9ff 0%,#27c5ff 45%,#3b75ff 100%)!important}
.b3{background:linear-gradient(180deg,#ffd95c 0%,#ffad27 45%,#ff653c 100%)!important}
.menuButtons{display:flex;flex-direction:column;gap:11px;margin-top:3px}
.menuButtons .btn{width:min(310px,88vw)}

/* Même finition glossy pour les boutons des autres écrans */
.scr:not(#menu) .btn{min-height:56px!important;font-size:19px!important}
.scr:not(#menu) .btn .btnIcon{width:27px;height:27px}

.loadingBall{
  width:102px;height:102px;border-radius:50%;position:relative;
  animation:menuBallFloat 1.4s ease-in-out infinite;
  filter:drop-shadow(0 15px 25px rgba(0,0,0,.35));
}
.loadingBall .ballCore{width:100%;height:100%;border-radius:50%;position:absolute;background:radial-gradient(circle at 30% 24%,#fff 0 9%,var(--ball1,#8eeaff) 30%,var(--ball2,#062c7a) 76%,#030816);box-shadow:inset -12px -15px 22px rgba(0,0,0,.28),inset 8px 7px 15px rgba(255,255,255,.22),0 0 30px rgba(80,210,255,.25);overflow:hidden}
.loadingBall .ballCore::after{content:"";position:absolute;width:22px;height:22px;left:20px;top:16px;border-radius:50%;background:rgba(255,255,255,.7)}
.loadingBall .ballRing{position:absolute;inset:-10px;border:5px solid rgba(255,255,255,.28);border-left-color:#fff;border-radius:50%;animation:menuRingSpin .8s linear infinite}

/* mobile */
@media(max-width:700px){

  #mobileControls{
    display:block;
  }

  #mobileControls.active{
    display:block;
  }

  body{
    overscroll-behavior:none;
  }

  .scr{
    justify-content:center;
    gap:12px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    width:min(430px,94vw);
    max-height:56vh;
  }

  .row{
    width:100%;
  }

  .chip{
    font-size:15px;
  }

  #menu > svg{
    width:95px;
  }

  #menu p{
    font-size:15px;
  }

  #hud{
    gap:6px;
  }

  #hud .chip{
    min-height:40px;
    padding:6px 9px;
    font-size:14px;
  }

  #bar{
    min-width:40px;
  }

}

/* petits téléphones */
@media(max-width:390px){

  #movePad{
    width:125px;
    height:125px;
  }

  #padKnob{
    width:54px;
    height:54px;
  }

  #jumpBtn{
    width:78px;
    height:78px;
  }

  #jumpBtn span{
    font-size:35px;
  }

  #mobileHint{
    bottom:165px;
    font-size:12px;
  }

}

/* paysage téléphone */
@media(max-height:500px) and (orientation:landscape){

  #movePad{
    width:110px;
    height:110px;
    bottom:14px;
  }

  #jumpBtn{
    width:76px;
    height:76px;
    bottom:18px;
  }

  #mobileHint{
    display:none;
  }

  .scr{
    gap:7px;
  }

  .btn{
    min-height:48px;
    padding:10px 20px;
  }

  .grid{
    max-height:70vh;
  }
}

/* desktop : contrôles mobiles cachés */
@media(min-width:701px){
  #mobileControls{
    display:none!important;
  }
}
:root{--ink:#fff;--pink:#ff4fa3;--yel:#ffd23f;--cy:#3fe0ff;--grn:#5cf29a;--vio:#8b5cff;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.i{width:1.2em;height:1.2em;fill:currentColor;vertical-align:-.2em}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));background:rgba(6,12,32,.38);backdrop-filter:blur(5px);text-align:center;z-index:5}
.scr.on{display:flex}
h1{margin:0;font-size:clamp(44px,13vw,76px);line-height:.9;font-weight:700;letter-spacing:-.03em;background:linear-gradient(90deg,var(--pink),var(--yel),var(--grn),var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px rgba(0,0,0,.4))}
h2{margin:0;font-size:38px}
p{margin:0;opacity:.85}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-width:220px;padding:15px 26px;border:0;border-radius:22px;font:700 20px Fredoka,system-ui,sans-serif;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.28),0 12px 26px rgba(0,0,0,.3);transition:transform .12s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.b1{background:linear-gradient(135deg,#ff4fa3,#8b5cff)}
.b2{background:linear-gradient(135deg,#1fc8ff,#2ee59d)}
.b3{background:linear-gradient(135deg,#ffb020,#ff5c39)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:99px;background:rgba(5,15,40,.5);border:2px solid rgba(255,255,255,.2);font-weight:700;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(440px,100%);max-height:58vh;overflow:auto;padding:4px;touch-action:pan-y}
.card{border-radius:20px;padding:12px 4px;background:rgba(255,255,255,.13);border:3px solid rgba(255,255,255,.22);color:#fff;font:600 13px Fredoka,system-ui,sans-serif;cursor:pointer}
.card b{display:block;font-size:26px}
.card.sel{border-color:var(--yel);background:rgba(255,210,63,.2)}
.card.lock{opacity:.45}
.orb{width:48px;height:48px;border-radius:50%;margin:0 auto 6px;box-shadow:inset -5px -6px 10px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.3)}
#hud{position:fixed;left:0;right:0;top:0;display:none;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 0;z-index:4;pointer-events:none}
#hud.on{display:flex}
#hud .chip{padding:6px 12px;font-size:17px}
#bar{flex:1;height:14px;border-radius:9px;background:rgba(5,15,40,.5);border:2px solid rgba(255,255,255,.25);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--yel))}

#bn{position:fixed;left:50%;top:26%;transform:translateX(-50%);font-size:clamp(24px,7vw,40px);font-weight:700;text-align:center;opacity:0;z-index:4;pointer-events:none;text-shadow:0 4px 20px rgba(0,0,0,.6)}

#loadingPercent{font-weight:700;opacity:.85}
@keyframes loadSpin{to{transform:rotate(360deg)}}
</style>
</head>

<script>
/* Basé sur SKYDREAMS de Frank Force (JS1024 2026) — moteur 3D pseudo-perspective conservé,
   enrichi : niveaux, skins, pièces, SFX, musique, particules, UI mobile. */
'use strict';
const $=id=>document.getElementById(id),cv=$('cv'),c=cv.getContext('2d');
let W,H,dpr;
function rs(){dpr=Math.min(devicePixelRatio||1,1.5);W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr}
addEventListener('resize',rs);rs();

// ---------- sauvegarde ----------
let S={coins:0,best:0,unl:1,owned:[0],skin:0,mute:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('skyd')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('skyd',JSON.stringify(S))}catch(e){}};

// nom, objectif, teinte ciel, teinte piste, vitesse, chance de trou, chance de case vide
const LV=[
 ['Sky',400,200,120,.17,.05,.03,'sky'],
 ['Cloud City',700,215,175,.19,.07,.05,'cloud'],
 ['UFO Zone',1000,240,205,.21,.09,.07,'ufo'],
 ['Galaxy Run',1400,270,275,.23,.10,.08,'galaxy'],
 ['Volcanic Run',1900,20,35,.25,.13,.10,'volcano'],
 ['Ice Mountain',2400,190,205,.24,.14,.10,'ice'],
 ['Neon City',2900,280,305,.26,.15,.12,'cyber'],
 ['Storm Clouds',3400,220,250,.27,.16,.13,'storm'],
 ['Rainbow Sky',4000,320,170,.24,.13,.10,'rainbow'],
 ['Void End',1e9,280,300,.22,.12,.10,'void']
];
const SK=[
  ['Sky',0,'#8eeaff','#062c7a','sky'],
  ['Fire',30,'#fff6a0','#8b0800','fire'],
  ['Ice',60,'#b9f7ff','#0872c9','ice'],
  ['Toxic',90,'#eaff9c','#176b00','toxic'],
  ['Void',130,'#9b5cff','#180044','void'],
  ['Gold',190,'#fffbd0','#8b4c00','gold'],
  ['Neon',260,'#00ffff','#073b8f','neon'],
  ['Lava',330,'#ffff9c','#4b0000','lava'],
  ['Galaxy',400,'#ff8cff','#020018','galaxy'],
  ['Rainbow',500,'#ffffff','#a64bff','rainbow']
];

// ---------- audio ----------
let ac,mg,sg,mu,mstep=0,nt=0;
let music=new Audio('music.mp3');
music.loop=true;
let menuMusic=new Audio('menu.mp3');
menuMusic.loop=true;
menuMusic.preload='auto';
menuMusic.volume=.45;
let gameOverSound=new Audio('gameover.mp3');
gameOverSound.preload='auto';
gameOverSound.volume=.75;
music.preload='auto';
music.volume=.55;

const mf=n=>440*2**((n-69)/12);

function setVol(){
  if(ac){
    mg.gain.value=S.mute?0:.48;
    sg.gain.value=S.mute?0:.62;
  }
  music.volume=S.mute?0:.55;
  menuMusic.volume=S.mute?0:.45;
}

function initA(){
  if(ac){
    if(ac.state==='suspended')ac.resume();
    setVol();
    updateMusic();
    return;
  }

  try{
    ac=new(window.AudioContext||window.webkitAudioContext)();

    mg=ac.createGain();
    sg=ac.createGain();

    mg.connect(ac.destination);
    sg.connect(ac.destination);

    mu=ac.createGain();
    mu.gain.value=.72;

    const f=ac.createBiquadFilter();
    f.type='lowpass';
    f.frequency.value=5600;
    f.Q.value=.45;

    mu.connect(f);
    f.connect(mg);

    setVol();
    setVol();
    updateMusic();
  }catch(e){}
}

function updateMusic(){
  if(S.mute){
    music.pause();
    menuMusic.pause();
    return;
  }
  if(st==='menu'||st==='levels'||st==='shop'||st==='pause'||st==='over'||st==='win'){
    music.pause();
    menuMusic.play().catch(()=>{});
  }else if(st==='play'){
    menuMusic.pause();
    music.play().catch(()=>{});
  }
}

function tone(f,t,d,ty,v,dst,f2){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=ty;
  o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);
  g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);
  g.connect(dst);
  o.start(t);
  o.stop(t+d+.02);
}

/*
  Arcade platform music originale.
  Tempo rapide (~170 BPM), basse rebondissante,
  mélodie accrocheuse et accents rétro.
  Inspiration générale : jeux de plateforme rapides
  et musique arcade 16/32-bit, sans reprendre une mélodie existante.
*/

const CH=[
  [60,64,67,72], // C
  [57,60,64,69], // Am
  [53,57,60,65], // F
  [55,59,62,67]  // G
];

const LEAD=[
  [72,76,79,76,74,76,84,81,79,76,74,72,76,79,84,81],
  [69,72,76,79,76,72,74,76,81,79,76,72,69,72,76,79],
  [72,74,77,81,79,77,74,72,76,79,81,84,81,79,77,74],
  [79,83,86,83,81,79,76,79,81,83,86,88,86,83,81,79]
];

const BASS=[
  [36,36,43,36,48,43,36,43],
  [33,33,40,33,45,40,33,40],
  [29,29,36,29,41,36,29,36],
  [31,31,38,31,43,38,31,38]
];

function sched(){
  if(!ac||ac.state!=='running')return;

  while(nt<ac.currentTime+.35){

    const step=mstep&15;
    const bar=(mstep>>4)&3;
    const lead=LEAD[bar];
    const bass=BASS[bar];
    const ch=CH[bar];

    // Mélodie principale : brillante et très rythmée
    tone(
      mf(lead[step]),
      nt,
      .145,
      'square',
      .075,
      mu
    );

    // Double octave sur les réponses
    if(step===3||step===7||step===11||step===15){
      tone(
        mf(lead[step]+12),
        nt+.018,
        .095,
        'triangle',
        .045,
        mu
      );
    }

    // Petite réponse de synthé sur les contretemps
    if(step===5||step===13){
      tone(
        mf(lead[(step+1)&15]-12),
        nt+.055,
        .09,
        'square',
        .035,
        mu
      );
    }

    // Basse sautillante
    tone(
      mf(bass[step&7]),
      nt,
      .17,
      'sawtooth',
      .135,
      mu,
      mf(bass[step&7]+5)
    );

    // Kick synthétique
    if(step===0||step===4||step===8||step===12){
      tone(105,nt,.10,'sine',.27,sg,52);
    }

    // Snare / clap synthétique
    if(step===4||step===12){
      tone(185,nt,.055,'square',.06,sg,110);
      tone(720,nt,.035,'triangle',.045,sg);
    }

    // Hi-hat arcade très léger
    if(step%2===0){
      tone(1500,nt,.025,'square',.018,sg);
    }

    // Accord d'ouverture de chaque phrase
    if(step===0){
      ch.forEach((n,i)=>{
        tone(mf(n+12),nt+i*.014,.34,'triangle',.022,mu);
      });
    }

    // Petite montée de fin de phrase
    if(step===14){
      tone(mf(lead[15]+12),nt+.055,.08,'square',.035,mu);
    }

    mstep++;
    // ~170 BPM : 16e de note
    nt+=.0882;
  }
}

function sfx(n){
  if(!ac||S.mute)return;
  const t=ac.currentTime;

  if(n=='j')
    tone(330,t,.13,'square',.34,sg,760);

  if(n=='l')
    tone(175,t,.13,'sine',.46,sg,60);

  if(n=='c'){
    tone(880,t,.07,'square',.13,sg);
    tone(1320,t+.055,.14,'square',.13,sg);
  }

  if(n=='f'){
    tone(520,t,.55,'sawtooth',.16,sg,58);
  }

  if(n=='w'){
    [523,659,784,988,1175,1319].forEach((f,i)=>{
      tone(f,t+i*.075,.24,'triangle',.32,sg);
    });
  }

  if(n=='u')
    tone(700,t,.06,'square',.08,sg);
}
// ---------- monde ----------
let st='menu',lv=Math.min(S.unl,LV.length)-1,x=0,y=0,z=0,vy=0,tx=0,jb=0,T=0,run=0,shake=0,falling=0,parts=[];
let rows=[],gap=0,sx=3,sw=3;
const keys={};
function gen(n){
  const L=LV[lv];
  while(rows.length<=n){
    const i=rows.length;
    if(gap<-8&&Math.random()<L[5])gap=2+Math.min(3,lv*.7+i/500)|0;
    if(Math.random()<.1){sw=2+Math.random()*3|0;sx=Math.max(0,Math.min(7-sw,sx-2+Math.random()*5|0))}
    gap--;
    const r=[];
    for(let j=0;j<7;j++){
      const on=gap<0&&sx<=j&&j<sx+sw;
      const t=i<35||Math.random()>.9||(on&&Math.random()>L[6]);
      r[j]=t?(i>=8&&on&&Math.random()<.07?2:1):0;
    }
    rows[i]=r;
  }
}
const P=(a,b,d)=>{const k=H*.7/d;return[W/2+(a-x+(d-3)**2/50*Math.cos((z+d)/49))*k,H/2-(b-2+d*d/50)*k,k]};
const hsl=(h,s,l,a=1)=>c.fillStyle=`hsl(${h},${s}%,${l}%,${a})`;
const skc=()=>{const s=SK[S.skin];return[s[2]||`hsl(${z*3%360},90%,65%)`,s[3]||`hsl(${(z*3+50)%360},90%,40%)`]};

function drawBallFX(a,b,k,R,c1,c2){
  const theme=SK[S.skin][4]||'sky';
  const t=T*.08;

  // Traînée commune, plus ou moins longue selon le skin
  c.save();
  c.globalCompositeOperation='lighter';
  for(let i=1;i<=7;i++){
    const al=(.16*(8-i))/7;
    const yy=b+i*R*.48+Math.sin(t+i*.7)*R*.12;
    c.globalAlpha=al;
    c.fillStyle=c1;
    c.beginPath();
    c.arc(a,yy,R*(1-i*.075),0,7);
    c.fill();
  }
  c.globalAlpha=1;

  if(theme==='fire'||theme==='lava'){
    for(let i=0;i<7;i++){
      const an=t*1.8+i*.9;
      const px=a+Math.cos(an)*R*(.7+i*.12);
      const py=b+Math.sin(an)*R*(.7+i*.12)+R*.8;
      c.globalAlpha=.75-i*.08;
      c.fillStyle=i%2?'#ffb000':'#ff3b00';
      c.beginPath();c.arc(px,py,R*(.10+i*.015),0,7);c.fill();
    }
  }

  if(theme==='ice'){
    c.strokeStyle='#dfffff';c.lineWidth=Math.max(1,k*.035);c.globalAlpha=.8;
    for(let i=0;i<4;i++){
      const an=t+i*Math.PI/2;
      const px=a+Math.cos(an)*R*1.7,py=b+Math.sin(an)*R*1.7;
      c.beginPath();c.moveTo(px,py-R*.2);c.lineTo(px+R*.15,py);c.lineTo(px,py+R*.2);c.stroke();
    }
  }

  if(theme==='toxic'){
    c.fillStyle='#9aff38';
    for(let i=0;i<5;i++){
      const px=a+Math.sin(t*1.4+i)*R*(1.1+i*.12);
      const py=b+R*(1+i*.18);
      c.globalAlpha=.55;
      c.beginPath();c.arc(px,py,R*(.12+i*.02),0,7);c.fill();
    }
  }

  if(theme==='void'||theme==='neon'||theme==='galaxy'){
    c.globalAlpha=.75;
    c.strokeStyle=theme==='void'?'#c285ff':theme==='neon'?'#00ffff':'#ff69df';
    c.lineWidth=Math.max(1,k*.025);
    c.beginPath();
    c.ellipse(a,b,R*1.75,R*.62,t,0,7);c.stroke();
    c.beginPath();
    c.ellipse(a,b,R*.62,R*1.75,-t,0,7);c.stroke();
  }

  if(theme==='gold'){
    c.strokeStyle='#ffe36b';c.lineWidth=Math.max(1,k*.035);c.globalAlpha=.8;
    c.beginPath();
    for(let i=0;i<10;i++){
      const an=t+i*Math.PI/5,rr=i%2?R*.65:R*1.55;
      const px=a+Math.cos(an)*rr,py=b+Math.sin(an)*rr;
      if(i===0)c.moveTo(px,py);else c.lineTo(px,py);
    }
    c.closePath();c.stroke();
  }

  if(theme==='rainbow'){
    const cols=['#ff4b4b','#ffe74b','#50ff70','#48aaff','#a64bff'];
    c.lineWidth=Math.max(1,k*.035);
    for(let i=0;i<5;i++){
      c.globalAlpha=.7;
      c.strokeStyle=cols[i];
      c.beginPath();
      c.arc(a,b,R*(1.25+i*.12),Math.PI+.35,Math.PI*2-.35);
      c.stroke();
    }
  }

  c.restore();
};

function burst(n,col,sp,up){
  const[a,b,k]=P(x,Math.max(y,0)+.1,3);
  for(let i=0;i<n&&parts.length<250;i++){const an=Math.random()*6.28,v=Math.random()*sp*k*.02;
    parts.push({x:a,y:b,vx:Math.cos(an)*v,vy:Math.sin(an)*v-(up?k*.012:0),l:30+Math.random()*20,m:50,c:col,s:(2+Math.random()*3)*dpr})}
}

// ---------- logique ----------
function stepG(){
  T++;
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.03*dpr;p.l--}
  parts=parts.filter(p=>p.l>0);
  shake*=.9;
  if(st==='menu'){z+=.1;return}
  if(st!=='play')return;
  const L=LV[lv];
  if(keys.l)tx-=.16;if(keys.r)tx+=.16;
  tx=Math.max(-3.5,Math.min(3.5,tx));x+=(tx-x)*.3;
  gen(z+45|0);
  y+=vy-=.006;if(jb>0)jb--;
  z+=Math.min(.5,L[4]+z/6000);
  const ri=(z+3)|0,ci=Math.round(x+3),cell=rows[ri][ci];
  if(y<0&&y>-.3&&cell){
    const hit=vy<-.03;y=0;
    if(jb>0){vy=.11;jb=0;sfx('j');burst(8,skc()[0],4,0)}
    else{vy=0;if(hit){sfx('l');shake=3;burst(10,'#fff',5,1)}}
  }
  if(cell==2&&y>-.4&&y<1.2&&Math.abs(x-(ci-3))<.65){
    rows[ri][ci]=1;run++;sfx('c');burst(14,'#ffd23f',7,1);
  }
  if(T%2==0){const[a,b,k]=P(x,y+.3,3);parts.push({x:a,y:b,vx:0,vy:0,l:22,m:22,c:skc()[0],s:k*.16})}
  if(y<-.3&&!falling){falling=1;sfx('f')}
  if(y<-4)return endRun(0);
  if(z>=L[1])return endRun(1);
  if(T%4==0){$('sc').textContent=z|0;$('cn').textContent=S.coins+run;$('bf').style.width=Math.min(100,z/L[1]*100)+'%'}
}

function drawStars(n){for(let i=0;i<n;i++){const xx=(i*97+z*(i%4+1)*.25)%W,yy=(i*53)% (H*.65),r=(i%3+1)*dpr;c.globalAlpha=.35+.55*Math.abs(Math.sin(T*.025+i));c.fillStyle='#fff';c.fillRect(xx,yy,r,r)}c.globalAlpha=1}

function draw(){
  const L=LV[lv],inf=lv==LV.length-1,h=(L[2]+(inf?z*.15:0))%360,th=(L[3]+(inf?z*.15:0))%360;
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;
  c.save();if(shake>.5)c.translate((Math.random()-.5)*shake*dpr,(Math.random()-.5)*shake*dpr);
  gen(z+45|0);
  drawMapTheme(L[7],h);
  const sg2=c.createRadialGradient(W*.5,H*.36,0,W*.5,H*.36,H*.32);
  sg2.addColorStop(0,`hsla(${h+30},100%,88%,.18)`);sg2.addColorStop(1,`hsla(${h+30},100%,70%,0)`);
  c.fillStyle=sg2;c.fillRect(0,0,W,H);
  // piste
  const r0=z+40|0;
  for(let r=r0;r>z;r--){
    const d=r-z;c.globalAlpha=Math.min(1,(41-d)/10);
    for(let pass=2;pass--;)for(let i=7;i--;){
      const cell=rows[r][i];if(!cell)continue;
      const[ax,ay]=P(i-3.5,0,d),[bx,by]=P(i-2.5,0,d),[ex,ey]=P(i-3.5,0,d+1),[fx,fy]=P(i-2.5,0,d+1),hh=(th+(r>>6)*40)%360,par=(r+i)&1;
      if(pass){hsl(hh,60,32+par*9);c.fillRect(ex,ey,fx-ex,(40-d)/30*H)}
      else{
        hsl(hh,60,12+par*5);c.fillRect(ax,ay,bx-ax,(40-d)/30*H);
        hsl(hh,65,58+par*20);c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.lineTo(fx,fy);c.lineTo(ex,ey);c.closePath();c.fill();
        if(cell==2){
          const[cx,cy,k]=P(i-3,.55+.08*Math.sin(T*.1+r),d),rad=k*.16;
          c.fillStyle='#ffd23f';c.beginPath();c.ellipse(cx,cy,Math.max(rad*.12,rad*Math.abs(Math.cos(T*.06+r))),rad,0,0,7);c.fill();
          c.strokeStyle='#fff6b0';c.lineWidth=2*dpr;c.stroke();
        }
      }
    }
  }
  c.globalAlpha=1;
  // balle
  if(st!=='menu'){
    if(y>=0&&rows[z+3|0][Math.round(x+3)]){const[a,b,k]=P(x,0,3);c.fillStyle='rgba(0,0,0,.45)';c.beginPath();c.ellipse(a,b,k/4,k/9,0,0,7);c.fill()}
    const[a,b,k]=P(x,y+.35,3),R=k*.33,[c1,c2]=skc();

    // Effets et traînée propres au skin
    drawBallFX(a,b,k,R,c1,c2);

    c.globalAlpha=.25;c.fillStyle=c1;c.beginPath();c.arc(a,b,R*1.5,0,7);c.fill();c.globalAlpha=1;

    const bg=c.createRadialGradient(a-R*.35,b-R*.4,R*.08,a,b,R);
    bg.addColorStop(0,'#fff');bg.addColorStop(.3,c1);bg.addColorStop(1,c2);
    c.fillStyle=bg;c.beginPath();c.arc(a,b,R,0,7);c.fill();

    // Reflet animé
    const shine=(Math.sin(T*.09)+1)/2;
    c.globalAlpha=.35+.35*shine;
    c.fillStyle='#fff';
    c.beginPath();
    c.arc(a-R*.28,b-R*.32,R*.16,0,7);
    c.fill();
    c.globalAlpha=1;

    // Détails visibles de la balle
    const theme=SK[S.skin][4];
    c.save();
    c.globalAlpha=.8;
    c.lineWidth=Math.max(1,k*.025);
    if(theme==='neon'){
      c.strokeStyle='#ff35ff';
      c.beginPath();c.arc(a,b,R*.72,T*.03,T*.03+Math.PI*1.35);c.stroke();
    }else if(theme==='galaxy'){
      c.fillStyle='#fff';
      for(let i=0;i<4;i++){
        const an=T*.03+i*1.7;
        c.beginPath();c.arc(a+Math.cos(an)*R*.55,b+Math.sin(an)*R*.55,R*.055,0,7);c.fill();
      }
    }else if(theme==='ice'){
      c.strokeStyle='#fff';
      c.beginPath();c.moveTo(a-R*.45,b);c.lineTo(a,b-R*.45);c.lineTo(a+R*.45,b);c.stroke();
    }else if(theme==='void'){
      c.strokeStyle='#e0a8ff';
      c.beginPath();c.arc(a,b,R*.68,-T*.04,T*.04+Math.PI*1.5);c.stroke();
    }
    c.restore();
  }
  // particules
  for(const p of parts){c.globalAlpha=p.l/p.m;c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.s*(p.l/p.m),0,7);c.fill()}
  c.globalAlpha=1;c.restore();
}

function start(l){
  lv=l;resetWorld();run=0;jb=0;
  show('loading');$('hud').classList.remove('on');
  initA();updateMusic();
  const fill=$('loadingFill'),pct=$('loadingPercent'),title=$('loadingTitle'),text=$('loadingText');
  let progress=0;
  const steps=['Préparation du ciel','Génération de la piste','Chargement des obstacles','Placement des pièces','Prêt !'];
  fill.style.width='0%';pct.textContent='0%';title.textContent='Préparation...';text.textContent=steps[0];
  const timer=setInterval(()=>{
    progress+=Math.floor(Math.random()*18)+8;
    if(progress>=100)progress=100;
    fill.style.width=progress+'%';pct.textContent=progress+'%';
    text.textContent=steps[Math.min(steps.length-1,Math.floor(progress/25))];
    if(progress>=100){
      clearInterval(timer);
      setTimeout(()=>{
        st='play';show('');$('hud').classList.add('on');
        $('bf').style.width='0';$('sc').textContent='0';$('cn').textContent=S.coins;

        updateMobileUI();
      },180);
    }

  st=w?'win':'over';const bonus=w?lv*15+30:0;

  if(w)S.unl=Math.max(S.unl,Math.min(lv+2,LV.length));

function showMobileHint(){

  if(localStorage.getItem('skyd_mobile_hint')) return;

  mobileHint.classList.add('show');

  setTimeout(()=>{
    mobileHint.classList.remove('show');
    localStorage.setItem('skyd_mobile_hint','1');
  },3200);
}

function vibrate(ms=10){
  if(navigator.vibrate){
    try{
      navigator.vibrate(ms);
    }catch(e){}
  }
}

function resetPad(){

  padKnob.style.transform =
    'translate(-50%,-50%)';

  keys.l=0;
  keys.r=0;

  tx=x;
}

function calculatePadCenter(){

  const r=movePad.getBoundingClientRect();

  padCenterX=r.left+r.width/2;
  padCenterY=r.top+r.height/2;
}

function updatePad(clientX,clientY){

  let dx=clientX-padCenterX;
  let dy=clientY-padCenterY;

  const dist=Math.hypot(dx,dy);

  if(dist>PAD_RADIUS){

    const ratio=PAD_RADIUS/dist;

    dx*=ratio;
    dy*=ratio;

  }

  const nx=dx/PAD_RADIUS;
  const ny=dy/PAD_RADIUS;

  padKnob.style.transform =
    `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;

  /*
    Gauche / droite
  */
  if(Math.abs(nx)<.12){

    keys.l=0;
    keys.r=0;

  }else if(nx<0){

    keys.l=1;
    keys.r=0;

  }else{

    keys.l=0;
    keys.r=1;

  }

  /*
    Petite influence verticale :
    un mouvement vers le haut peut aussi
    aider à corriger la trajectoire.
  */

  if(Math.abs(ny)>.65 && ny<0){
    jb=4;
  }

}

movePad.addEventListener('pointerdown',e=>{

  if(st!=='play') return;

  e.preventDefault();

  padPointer=e.pointerId;

  movePad.setPointerCapture(e.pointerId);

  calculatePadCenter();

  updatePad(e.clientX,e.clientY);

  vibrate(7);

});

movePad.addEventListener('pointermove',e=>{

  if(e.pointerId!==padPointer) return;

  if(st!=='play') return;

  e.preventDefault();

  updatePad(e.clientX,e.clientY);

});

function endPad(e){

  if(e.pointerId!==padPointer) return;

  padPointer=null;

  resetPad();

}

movePad.addEventListener('pointerup',endPad);
movePad.addEventListener('pointercancel',endPad);
movePad.addEventListener('lostpointercapture',()=>{

  padPointer=null;
  resetPad();

});


/* =========================================================
   BOUTON SAUT
   ========================================================= */

function jumpPressed(e){

  e.preventDefault();

  if(st!=='play') return;

  jb=10;

  jumpBtn.classList.add('pressed');

  vibrate(12);

  sfx('j');

}

function jumpReleased(e){

  e.preventDefault();

  jumpBtn.classList.remove('pressed');

}

jumpBtn.addEventListener('pointerdown',jumpPressed);
jumpBtn.addEventListener('pointerup',jumpReleased);
jumpBtn.addEventListener('pointercancel',jumpReleased);
jumpBtn.addEventListener('pointerleave',jumpReleased);


/* =========================================================
   PAUSE
   ========================================================= */

mobilePause.addEventListener('click',e=>{

  e.preventDefault();

  togglePause();

  vibrate(8);

});


/* =========================================================
   FEEDBACK TACTILE
   ========================================================= */

document.addEventListener('pointerdown',e=>{

  if(e.pointerType!=='touch') return;

  const target=e.target;

  if(
    target.closest('button') ||
    target.closest('#movePad')
  ) return;

  const f=$('touchFeedback');

  f.style.left=e.clientX+'px';
  f.style.top=e.clientY+'px';

  f.classList.remove('show');

  void f.offsetWidth;

  f.classList.add('show');

});


/* =========================================================
   VIBRATION DES ACTIONS
   ========================================================= */

const oldAct=act;

act=function(a){

  oldAct(a);

  if(
    a==='play' ||
    a==='retry' ||
    a==='next'
  ){
    vibrate(15);
  }

  if(a==='pause'){
    vibrate(8);
  }

  updateMobileUI();

};


/* =========================================================
   DÉTECTION DU DÉMARRAGE
   ========================================================= */

const oldStart=start;

start=function(l){

  oldStart(l);

  updateMobileUI();

  if(isTouchDevice){
    setTimeout(showMobileHint,500);
  }

};


/* =========================================================
   MENU
   ========================================================= */

const oldMenu=menu;

menu=function(){

  oldMenu();

  resetPad();
  updateMobileUI();

};


/* =========================================================
   PAUSE / RETOUR
   ========================================================= */

const oldTogglePause=togglePause;

togglePause=function(){

  oldTogglePause();

  if(st==='play'){

    updateMobileUI();

  }else{

    mobileUI.classList.remove('active');
    resetPad();

  }

};


/* =========================================================
   VISIBILITÉ
   ========================================================= */

document.addEventListener('visibilitychange',()=>{

  if(document.hidden){

    resetPad();

  }

});


/* =========================================================
   ORIENTATION / RESIZE
   ========================================================= */

addEventListener('resize',()=>{

  if(st==='play'){
    calculatePadCenter();
  }

});

addEventListener('orientationchange',()=>{

  setTimeout(()=>{
    calculatePadCenter();
  },250);

});


/* =========================================================
   INITIALISATION
   ========================================================= */

setTimeout(()=>{

  updateMobileUI();

},100);
</script>
</body>
