<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SkyDreams — Endless Sky</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
:root{--ink:#fff;--pink:#ff4fa3;--yel:#ffd23f;--cy:#3fe0ff;--grn:#5cf29a;--vio:#8b5cff;--c1:#8eeaff;--c2:#062c7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.i{width:1.2em;height:1.2em;fill:currentColor;vertical-align:-.2em}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));background:rgba(6,12,32,.5);backdrop-filter:blur(8px);text-align:center;z-index:5}
.scr.on{display:flex;animation:sin .3s ease}
@keyframes sin{from{opacity:0;transform:scale(1.025)}to{opacity:1;transform:none}}
h2{margin:0;font-size:clamp(34px,9vw,48px);text-shadow:0 5px 20px rgba(0,0,0,.3)}
p{margin:0;opacity:.85}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-width:min(260px,88vw);min-height:56px;padding:14px 26px;border:0;border-radius:20px;font:700 20px Fredoka,system-ui,sans-serif;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.28),0 12px 26px rgba(0,0,0,.3);transition:transform .12s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.b1{background:linear-gradient(135deg,#ff4fa3,#8b5cff)}.b2{background:linear-gradient(135deg,#1fc8ff,#2ee59d)}.b3{background:linear-gradient(135deg,#ffb020,#ff5c39)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:99px;background:rgba(5,15,40,.55);border:2px solid rgba(255,255,255,.22);font-weight:700;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(440px,100%);max-height:58vh;overflow:auto;padding:4px;touch-action:pan-y}
.card{border-radius:20px;padding:12px 4px;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.22);color:#fff;font:600 13px Fredoka,system-ui,sans-serif;cursor:pointer}
.card b{display:block;font-size:26px}.card.sel{border-color:var(--yel);background:rgba(255,210,63,.2)}.card.lock{opacity:.45}
.orb{width:52px;height:52px;border-radius:50%;margin:0 auto 6px;border:2px solid rgba(255,255,255,.35);box-shadow:inset -5px -6px 10px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.3)}
.big{font-size:56px;font-weight:700;color:var(--yel);line-height:1}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:none;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 0;z-index:4;pointer-events:none}
#hud.on{display:flex}
#hud .chip{min-height:42px;padding:6px 12px;font-size:17px;backdrop-filter:blur(12px)}
#bar{flex:1;height:14px;border-radius:9px;background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.25);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--yel));transition:width .12s linear}
#pb{pointer-events:auto;width:46px;height:46px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(5,15,40,.6);color:#fff;font-size:20px;cursor:pointer}
#bn{position:fixed;left:50%;top:26%;transform:translateX(-50%);font-size:clamp(24px,7vw,40px);font-weight:700;text-align:center;opacity:0;z-index:60;pointer-events:none;text-shadow:0 4px 20px rgba(0,0,0,.6)}
#bn.go{animation:bn 2.4s ease forwards}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-30px) scale(.8)}15%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* ===== MENU FAÇON CAPTURE ===== */
#menu{padding:0;gap:0;justify-content:flex-start;align-items:stretch;text-align:left;backdrop-filter:none;overflow:hidden;
 background:radial-gradient(circle at 18% 55%,rgba(140,110,255,.55),transparent 42%),radial-gradient(circle at 85% 15%,rgba(255,110,220,.4),transparent 38%),linear-gradient(160deg,#3b2ddb,#5a2fcb 48%,#2b1aa0)}
#menu::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background:radial-gradient(circle 60px at 8% 20%,rgba(255,255,255,.12),transparent),radial-gradient(circle 90px at 60% 85%,rgba(120,220,255,.15),transparent),radial-gradient(circle 45px at 45% 12%,rgba(255,255,255,.1),transparent),radial-gradient(circle 70px at 95% 60%,rgba(255,255,255,.1),transparent)}
.m-top{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right)) 4px max(16px,env(safe-area-inset-left))}
.m-prof{display:flex;align-items:center;gap:10px;min-width:150px}
.m-av{position:relative;width:60px;height:60px;border-radius:50%;border:3px solid #ffd23f;background:radial-gradient(circle at 35% 28%,#fff,var(--c1) 35%,var(--c2));display:grid;place-items:center;font-size:28px;box-shadow:0 5px 12px rgba(0,0,0,.35)}
.m-av em{position:absolute;right:-6px;bottom:-4px;min-width:24px;height:24px;border-radius:50%;background:linear-gradient(#59b8ff,#2f63e8);border:2px solid #fff;font:700 13px/20px Fredoka;text-align:center;font-style:normal}
.m-prof b{display:block;font-size:15px}.stars{color:#ffd84a;font-size:16px;letter-spacing:1px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.m-cur{margin:0 auto;display:flex;gap:26px}
.pill{position:relative;min-width:150px;height:38px;padding:0 34px 0 40px;border-radius:20px;background:linear-gradient(#3a1f92,#22105f);border:2px solid rgba(255,255,255,.22);box-shadow:inset 0 2px 6px rgba(0,0,0,.4),0 4px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:21px}
.pill>svg{position:absolute;left:-8px;top:-5px;width:46px;height:46px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.pill.gem{border-color:rgba(120,190,255,.45)}.pill.gem>svg{color:#4fd8ff}
.pill i{position:absolute;right:-9px;top:1px;width:34px;height:34px;border-radius:50%;background:linear-gradient(#ff7fd0,#e0338f);border:2px solid #fff;font:700 24px/28px Fredoka;font-style:normal;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.gear{margin-left:auto;width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:linear-gradient(#5ac0ff,#2a68e6);color:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.m-body{position:relative;z-index:2;flex:1;min-height:0;display:grid;grid-template-columns:minmax(200px,1fr) minmax(320px,1.4fr);gap:2vw;align-items:center;padding:0 max(3vw,env(safe-area-inset-left)) 0 3vw}
.m-hero{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ball{position:relative;width:min(230px,28vh,30vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,var(--c1) 30%,var(--c2));box-shadow:inset -14px -18px 30px rgba(0,0,0,.28),0 26px 40px rgba(0,0,0,.3);animation:fl 3s ease-in-out infinite;display:grid;place-items:center;z-index:2}
.ball::after{content:"";position:absolute;left:18%;top:14%;width:22%;height:14%;border-radius:50%;background:rgba(255,255,255,.7);transform:rotate(-30deg)}
.gl{display:flex;gap:2px;font-size:clamp(34px,7vh,60px);color:#ff5fc4;text-shadow:0 0 0 #fff,0 3px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;margin-top:10%;line-height:1}
.board{position:relative;width:min(240px,26vh*1.4,32vw);height:26px;margin-top:-6%;border-radius:20px;background:linear-gradient(#ff63bd,#b82a86);transform:rotate(-12deg);box-shadow:0 12px 18px rgba(0,0,0,.35);animation:fl 3s ease-in-out infinite reverse}
.board::before,.board::after{content:"";position:absolute;bottom:-14px;width:28px;height:28px;border-radius:50%;background:radial-gradient(#fff 30%,#ff8fd5 32%,#d02a94);border:3px solid #7a1d5a}
.board::before{left:18%}.board::after{right:18%}
@keyframes fl{50%{transform:translateY(-8px)}}
.board{--r:-12deg}
.m-cards{display:grid;grid-template-columns:1fr 1.2fr;grid-template-rows:1fr 1fr;gap:14px;height:min(66vh,430px);max-width:560px;justify-self:center;width:100%}
.mc{position:relative;border-radius:22px;border:3px solid #fff;overflow:hidden;cursor:pointer;transform:skewX(-3deg) rotate(-1.5deg);box-shadow:0 10px 0 rgba(0,0,0,.25),0 18px 30px rgba(0,0,0,.35);transition:transform .14s,filter .14s;padding:0;color:inherit;font-family:inherit}
.mc:hover{transform:skewX(-3deg) rotate(-1.5deg) translateY(-5px);filter:brightness(1.07)}
.mc:active{transform:skewX(-3deg) rotate(-1.5deg) translateY(4px) scale(.97)}
.mc::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.7),transparent 45%)}
.mc .art{position:absolute;left:0;right:0;top:8%;text-align:center;font-size:clamp(48px,9vh,84px);filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.mc .lab{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:italic 700 clamp(16px,3.2vh,26px) Fredoka;color:#3f56d8;text-shadow:0 2px 0 rgba(255,255,255,.9)}
.mc .lab small{display:block;font-size:.5em;font-style:normal;opacity:.8}
.gp{grid-column:1;grid-row:1;background:linear-gradient(160deg,#eaf8ff,#94ccff 58%,#7b95ff)}
.rk{grid-column:1;grid-row:2;background:linear-gradient(160deg,#f0e2ff,#bb92ff 58%,#8c5ff0)}.rk .lab{color:#6a3bd0}
.pm{grid-column:2;grid-row:1/3;background:linear-gradient(160deg,#fff4b0,#ffc83a 55%,#ff9418)}.pm .lab{color:#c96a0e;font-size:clamp(20px,4vh,32px)}.pm .art{font-size:clamp(80px,17vh,150px);top:16%}
.pm .lab small{font-size:.45em}
.m-bot{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:6px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left))}
.chat{display:flex;align-items:center;gap:8px;width:min(340px,42vw);height:42px;padding:0 5px 0 12px;border-radius:22px;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.35);font-weight:600;font-size:15px}
.chat span{flex:1}.chat i{width:34px;height:34px;border-radius:50%;background:linear-gradient(#ff7fd0,#e0338f);border:2px solid #fff;font:700 22px/28px Fredoka;font-style:normal;text-align:center}
.rbs{display:flex;gap:clamp(8px,2vw,18px)}
.rb{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:#fff;font:700 13px Fredoka;cursor:pointer;text-shadow:0 2px 3px rgba(0,0,0,.4)}
.rb i{font-style:normal;width:54px;height:54px;border-radius:50%;background:linear-gradient(#63c0ff,#2e6be6);border:3px solid #fff;display:grid;place-items:center;font-size:24px;box-shadow:0 5px 0 #1b2f8f,0 10px 16px rgba(0,0,0,.3);transition:transform .1s}
.rb:active i{transform:translateY(4px)}
@media(max-width:700px){
 .m-cur{gap:20px}.pill{min-width:104px;font-size:16px;height:34px;padding:0 26px 0 32px}.pill>svg{width:38px;height:38px}.pill i{width:28px;height:28px;font-size:20px;line-height:22px}
 .m-prof b,.m-prof .stars{display:none}.m-prof{min-width:0}.m-av{width:48px;height:48px;font-size:22px}.gear{width:40px;height:40px}
 .m-body{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:6px;padding:0 14px}
 .m-hero{height:auto}.ball{width:min(110px,14vh)}.gl{font-size:28px}.board{width:120px;height:16px}.board::before,.board::after{width:18px;height:18px;bottom:-9px}
 .m-cards{height:100%;max-height:none;gap:9px}.chat{width:46vw;font-size:13px}.rb i{width:44px;height:44px;font-size:19px}.rb{font-size:11px}
}
@media(max-height:480px) and (orientation:landscape){.m-cards{height:62vh}.rb i{width:42px;height:42px}.chat{height:36px}}

/* LOADING */
#loadingScreen{z-index:50;background:radial-gradient(circle at 50% 35%,rgba(112,69,255,.45),transparent 40%),linear-gradient(145deg,#16053c,#3c1680 55%,#10052e)}
.loading-logo{width:105px;height:105px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff,var(--c1) 30%,var(--c2));border:4px solid rgba(255,255,255,.4);box-shadow:0 12px 35px rgba(0,0,0,.35);animation:lb 1s infinite}
@keyframes lb{50%{transform:translateY(-10px) scale(1.04)}}
.loading-title{font-size:clamp(25px,6vw,42px);font-weight:700}.loading-tip{opacity:.7;font-size:14px}
.loading-track{width:min(420px,82vw);height:20px;padding:3px;border-radius:99px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.2)}
.loading-track i{display:block;width:12%;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff54b7,#ffd64d,#66f5ff);animation:lbar 1.35s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes lbar{to{width:100%}}

/* MOBILE CONTROLS */
#mobileControls{position:fixed;inset:0;z-index:7;pointer-events:none;display:none;overflow:hidden}
#mobileControls.active{display:block}
#movePad{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:140px;height:140px;pointer-events:auto;touch-action:none}
.pad-ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.18),rgba(255,255,255,.07) 45%,rgba(5,15,40,.52) 70%);border:2px solid rgba(255,255,255,.25);backdrop-filter:blur(12px)}
#padKnob{position:absolute;width:60px;height:60px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#72e8ff 24%,#477cff 65%,#7b35ff);border:3px solid rgba(255,255,255,.65);box-shadow:0 5px 18px rgba(0,0,0,.35)}
#jumpBtn{position:absolute;right:max(25px,env(safe-area-inset-right));bottom:max(30px,env(safe-area-inset-bottom));width:90px;height:90px;border-radius:50%;border:3px solid rgba(255,255,255,.42);background:radial-gradient(circle at 35% 25%,#fff,#ffd23f 25%,#ff8b24 60%,#ff4f6d);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 0 rgba(130,40,20,.45),0 15px 35px rgba(0,0,0,.35);pointer-events:auto;touch-action:none;cursor:pointer;transition:transform .08s}
#jumpBtn span{font-size:40px;font-weight:700;line-height:30px}#jumpBtn small{font:700 10px Fredoka;letter-spacing:.12em}
#jumpBtn.pressed{transform:translateY(6px) scale(.94);box-shadow:0 2px 0 rgba(130,40,20,.45)}
#mobilePause{position:absolute;right:max(15px,env(safe-area-inset-right));top:calc(72px + env(safe-area-inset-top));width:48px;height:48px;border-radius:16px;border:1px solid rgba(255,255,255,.25);color:#fff;background:rgba(5,15,40,.55);pointer-events:auto;cursor:pointer;display:flex;align-items:center;justify-content:center}
#mobileHint{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);padding:11px 17px;border-radius:99px;background:rgba(5,15,40,.65);border:1px solid rgba(255,255,255,.2);font-size:14px;opacity:0;transition:opacity .3s}
#mobileHint.show{opacity:1}
#touchFeedback{position:fixed;width:45px;height:45px;border-radius:50%;border:2px solid rgba(255,255,255,.5);pointer-events:none;z-index:20;opacity:0}
#touchFeedback.show{animation:tp .35s ease-out}
@keyframes tp{0%{opacity:.8;transform:translate(-50%,-50%) scale(.5)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
@media(max-width:390px){#movePad{width:120px;height:120px}#jumpBtn{width:76px;height:76px}}
@media(max-height:500px) and (orientation:landscape){#movePad{width:108px;height:108px;bottom:14px}#jumpBtn{width:74px;height:74px;bottom:18px}#mobileHint{display:none}}
@media(min-width:701px){#mobileControls{display:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
<symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></symbol>
<symbol id="i-redo" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v12h14V9zm-8 0V7a3 3 0 0 1 6 0v2z"/></symbol>
<symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd23f" stroke="#fff6b0" stroke-width="1.2"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#e59a00" stroke-width="2"/></symbol>
<symbol id="i-gem" viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 13L2 9z" fill="currentColor" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/><path d="M2 9h20M9 3l-2 6 5 13 5-13-2-6" fill="none" stroke="#fff" stroke-opacity=".6"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.3 4.7L18.2 22 12 18.2 5.8 22l1.5-7.7L2 9.6 9 9z"/></symbol>
<symbol id="i-snd" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></symbol>
<symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zm11.3.7 1.4-1.4L18 10.6l2.3-2.3 1.4 1.4L19.4 12l2.3 2.3-1.4 1.4L18 13.4l-2.3 2.3-1.4-1.4L16.6 12z"/></symbol>
</svg>

<canvas id="cv"></canvas>
<div id="bn"></div>

<div id="hud">
  <span class="chip"><svg class="i" style="color:var(--cy)"><use href="#i-star"/></svg><span id="sc">0</span></span>
  <div id="bar"><i id="bf"></i></div>
  <span class="chip"><svg class="i"><use href="#i-coin"/></svg><span id="cn">0</span></span>
  <button id="pb" data-a="pause" aria-label="Pause"><svg class="i"><use href="#i-pause"/></svg></button>
</div>

<div id="mobileControls">
  <div id="mobileHint">👆 <b>Glisse pour te déplacer</b></div>
  <div id="movePad"><div class="pad-ring"><div id="padKnob"></div></div></div>
  <button id="jumpBtn" aria-label="Sauter"><span>↑</span><small>SAUT</small></button>
  <button id="mobilePause" aria-label="Pause"><svg class="i"><use href="#i-pause"/></svg></button>
</div>
<div id="touchFeedback"></div>

<!-- ===== MENU PRINCIPAL ===== -->
<section id="menu" class="scr on">
  <div class="m-top">
    <div class="m-prof">
      <div class="m-av">☁<em id="mLv">1</em></div>
      <div><b>SkyPilote</b><div class="stars">★★★★★</div></div>
    </div>
    <div class="m-cur">
      <div class="pill"><svg><use href="#i-coin"/></svg><span id="mc">0</span><i data-a="shop">+</i></div>
      <div class="pill gem"><svg><use href="#i-gem"/></svg><span id="mb">0</span><i data-a="play">+</i></div>
    </div>
    <button class="gear" id="gear" data-a="snd" aria-label="Son">⚙</button>
  </div>

  <div class="m-body">
    <div class="m-hero">
      <div class="ball"><div class="gl"><span>★</span><span>★</span></div></div>
      <div class="board"></div>
    </div>
    <div class="m-cards">
      <button class="mc gp" data-a="levels"><div class="art">🐰</div><div class="lab">Niveaux<small><span id="menuUnlocked">1</span>/10 débloqués</small></div></button>
      <button class="mc rk" data-a="shop"><div class="art">🎁</div><div class="lab">Skins<small>Ta balle</small></div></button>
      <button class="mc pm" data-a="play"><div class="art">🦊</div><div class="lab">▶ JOUER<small>Sky Run</small></div></button>
    </div>
  </div>

  <div class="m-bot">
    <div class="chat"><span>💬 Sky World</span><i data-a="prize">+</i></div>
    <div class="rbs">
      <button class="rb" data-a="rank"><i>📊</i>Classement</button>
      <button class="rb" data-a="rec"><i>🏆</i>Record</button>
      <button class="rb" data-a="prize"><i>🎁</i>Cadeau</button>
      <button class="rb" data-a="shop"><i>🛒</i>Boutique</button>
    </div>

<script>
/* Basé sur SKYDREAMS de Frank Force (JS1024 2026) — moteur pseudo-3D conservé. */
'use strict';
const $=id=>document.getElementById(id),cv=$('cv'),c=cv.getContext('2d');
let W,H,dpr;
function rs(){dpr=Math.min(devicePixelRatio||1,1.5);W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr}
addEventListener('resize',rs);rs();

// ---------- sauvegarde ----------
let S={coins:0,best:0,unl:1,owned:[0],skin:0,mute:0,gift:''};
try{Object.assign(S,JSON.parse(localStorage.getItem('skyd')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('skyd',JSON.stringify(S))}catch(e){}};

// nom, objectif, teinte ciel, teinte piste, vitesse, chance de trou, chance de case vide, thème
const LV=[
 ['Sky',400,200,120,.17,.05,.03,'sky'],['Cloud City',700,215,175,.19,.07,.05,'cloud'],
 ['UFO Zone',1000,240,205,.21,.09,.07,'ufo'],['Galaxy Run',1400,270,275,.23,.10,.08,'galaxy'],
 ['Volcanic Run',1900,20,35,.25,.13,.10,'volcano'],['Ice Mountain',2400,190,205,.24,.14,.10,'ice'],
 ['Neon City',2900,280,305,.26,.15,.12,'cyber'],['Storm Clouds',3400,220,250,.27,.16,.13,'storm'],
 ['Rainbow Sky',4000,320,170,.24,.13,.10,'rainbow'],['Void End',1e9,280,300,.22,.12,.10,'void']
];
const SK=[
 ['Sky',0,'#8eeaff','#062c7a','sky'],['Fire',30,'#fff6a0','#8b0800','fire'],['Ice',60,'#b9f7ff','#0872c9','ice'],
 ['Toxic',90,'#eaff9c','#176b00','toxic'],['Void',130,'#9b5cff','#180044','void'],['Gold',190,'#fffbd0','#8b4c00','gold'],
 ['Neon',260,'#00ffff','#073b8f','neon'],['Lava',330,'#ffff9c','#4b0000','lava'],
 ['Galaxy',400,'#ff8cff','#020018','galaxy'],['Rainbow',500,'#ffffff','#a64bff','rainbow']
];

// ---------- audio ----------
let ac,sg,st='menu';
const music=new Audio('music.mp3'),gameOverSound=new Audio('gameover.mp3'),menuSound=new Audio('menu.mp3');
music.loop=menuSound.loop=true;
[music,gameOverSound,menuSound].forEach(a=>a.preload='auto');
gameOverSound.volume=.75;
function setVol(){
  if(sg)sg.gain.value=S.mute?0:.62;
  music.volume=S.mute?0:.55;menuSound.volume=S.mute?0:.42;
}
function playMenuSound(){if(S.mute)return;music.pause();menuSound.play().catch(()=>{})}
function stopMenuSound(){menuSound.pause();menuSound.currentTime=0}
function initA(){
  try{
    if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();sg=ac.createGain();sg.connect(ac.destination)}
    if(ac.state==='suspended')ac.resume();
  }catch(e){}
  setVol();
  if(st==='menu'){if(menuSound.paused)playMenuSound()}
  else if(!S.mute&&music.paused&&st==='play')music.play().catch(()=>{});
}
function tone(f,t,d,ty,v,f2){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=ty;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(sg);o.start(t);o.stop(t+d+.02);
}
function sfx(n){
  if(!ac||S.mute)return;const t=ac.currentTime;
  if(n=='j')tone(330,t,.13,'square',.34,760);
  if(n=='l')tone(175,t,.13,'sine',.46,60);
  if(n=='c'){tone(880,t,.07,'square',.13);tone(1320,t+.055,.14,'square',.13)}
  if(n=='f')tone(520,t,.55,'sawtooth',.16,58);
  if(n=='w')[523,659,784,988,1175,1319].forEach((f,i)=>tone(f,t+i*.075,.24,'triangle',.32));
  if(n=='u')tone(700,t,.06,'square',.08);
}

// ---------- monde ----------
let lv=Math.min(S.unl,LV.length)-1,x=0,y=0,z=0,vy=0,tx=0,jb=0,T=0,run=0,shake=0,falling=0,parts=[];
let rows=[],gap=0,sx=3,sw=3;
const keys={};
function gen(n){
  const L=LV[lv];
  while(rows.length<=n){
    const i=rows.length;
    if(gap<-8&&Math.random()<L[5])gap=2+Math.min(3,lv*.7+i/500)|0;
    if(Math.random()<.1){sw=2+Math.random()*3|0;sx=Math.max(0,Math.min(7-sw,sx-2+Math.random()*5|0))}
    gap--;
    const r=[];
    for(let j=0;j<7;j++){
      const on=gap<0&&sx<=j&&j<sx+sw;
      const t=i<35||Math.random()>.9||(on&&Math.random()>L[6]);
      r[j]=t?(i>=8&&on&&Math.random()<.07?2:1):0;
    }
    rows[i]=r;
  }
}
const P=(a,b,d)=>{const k=H*.7/d;return[W/2+(a-x+(d-3)**2/50*Math.cos((z+d)/49))*k,H/2-(b-2+d*d/50)*k,k]};
const hsl=(h,s,l,a=1)=>c.fillStyle=`hsl(${h},${s}%,${l}%,${a})`;
const skc=()=>{const s=SK[S.skin];return[s[2],s[3]]};

function drawBallFX(a,b,k,R,c1){
  const th=SK[S.skin][4],t=T*.08;
  c.save();c.globalCompositeOperation='lighter';
  for(let i=1;i<=7;i++){
    c.globalAlpha=(.16*(8-i))/7;c.fillStyle=c1;c.beginPath();
    c.arc(a,b+i*R*.48+Math.sin(t+i*.7)*R*.12,R*(1-i*.075),0,7);c.fill();
  }
  c.globalAlpha=1;
  if(th==='fire'||th==='lava')for(let i=0;i<7;i++){
    const an=t*1.8+i*.9,px=a+Math.cos(an)*R*(.7+i*.12),py=b+Math.sin(an)*R*(.7+i*.12)+R*.8;
    c.globalAlpha=.75-i*.08;c.fillStyle=i%2?'#ffb000':'#ff3b00';c.beginPath();c.arc(px,py,R*(.1+i*.015),0,7);c.fill();
  }
  if(th==='ice'){
    c.strokeStyle='#dfffff';c.lineWidth=Math.max(1,k*.035);c.globalAlpha=.8;
    for(let i=0;i<4;i++){const an=t+i*Math.PI/2,px=a+Math.cos(an)*R*1.7,py=b+Math.sin(an)*R*1.7;
      c.beginPath();c.moveTo(px,py-R*.2);c.lineTo(px+R*.15,py);c.lineTo(px,py+R*.2);c.stroke()}
  }
  if(th==='toxic'){
    c.fillStyle='#9aff38';
    for(let i=0;i<5;i++){c.globalAlpha=.55;c.beginPath();c.arc(a+Math.sin(t*1.4+i)*R*(1.1+i*.12),b+R*(1+i*.18),R*(.12+i*.02),0,7);c.fill()}
  }
  if(th==='void'||th==='neon'||th==='galaxy'){
    c.globalAlpha=.75;c.strokeStyle=th==='void'?'#c285ff':th==='neon'?'#00ffff':'#ff69df';c.lineWidth=Math.max(1,k*.025);
    c.beginPath();c.ellipse(a,b,R*1.75,R*.62,t,0,7);c.stroke();
    c.beginPath();c.ellipse(a,b,R*.62,R*1.75,-t,0,7);c.stroke();
  }
  if(th==='gold'){
    c.strokeStyle='#ffe36b';c.lineWidth=Math.max(1,k*.035);c.globalAlpha=.8;c.beginPath();
    for(let i=0;i<10;i++){const an=t+i*Math.PI/5,rr=i%2?R*.65:R*1.55,px=a+Math.cos(an)*rr,py=b+Math.sin(an)*rr;i?c.lineTo(px,py):c.moveTo(px,py)}
    c.closePath();c.stroke();
  }
  if(th==='rainbow'){
    const cols=['#ff4b4b','#ffe74b','#50ff70','#48aaff','#a64bff'];c.lineWidth=Math.max(1,k*.035);
    cols.forEach((col,i)=>{c.globalAlpha=.7;c.strokeStyle=col;c.beginPath();c.arc(a,b,R*(1.25+i*.12),Math.PI+.35,Math.PI*2-.35);c.stroke()});
  }
  c.restore();
}
function burst(n,col,sp,up){
  const[a,b,k]=P(x,Math.max(y,0)+.1,3);
  for(let i=0;i<n&&parts.length<250;i++){const an=Math.random()*6.28,v=Math.random()*sp*k*.02;
    parts.push({x:a,y:b,vx:Math.cos(an)*v,vy:Math.sin(an)*v-(up?k*.012:0),l:30+Math.random()*20,m:50,c:col,s:(2+Math.random()*3)*dpr})}
}

// ---------- logique ----------
function stepG(){
  T++;
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.03*dpr;p.l--}
  parts=parts.filter(p=>p.l>0);
  shake*=.9;
  if(st==='menu'){z+=.1;return}
  if(st!=='play')return;
  const L=LV[lv];
  if(keys.l)tx-=.16;if(keys.r)tx+=.16;
  tx=Math.max(-3.5,Math.min(3.5,tx));x+=(tx-x)*.3;
  gen(z+45|0);
  y+=vy-=.006;if(jb>0)jb--;
  z+=Math.min(.5,L[4]+z/6000);
  const ri=(z+3)|0,ci=Math.round(x+3),cell=rows[ri][ci];
  if(y<0&&y>-.3&&cell){
    const hit=vy<-.03;y=0;
    if(jb>0){vy=.11;jb=0;sfx('j');burst(8,skc()[0],4,0)}
    else{vy=0;if(hit){sfx('l');shake=3;burst(10,'#fff',5,1)}}
  }
  if(cell==2&&y>-.4&&y<1.2&&Math.abs(x-(ci-3))<.65){rows[ri][ci]=1;run++;sfx('c');burst(14,'#ffd23f',7,1)}
  if(T%2==0){const[a,b,k]=P(x,y+.3,3);parts.push({x:a,y:b,vx:0,vy:0,l:22,m:22,c:skc()[0],s:k*.16})}
  if(y<-.3&&!falling){falling=1;sfx('f')}
  if(y<-4)return endRun(0);
  if(z>=L[1])return endRun(1);
  if(T%4==0){$('sc').textContent=z|0;$('cn').textContent=S.coins+run;$('bf').style.width=Math.min(100,z/L[1]*100)+'%'}
}

// ---------- rendu ----------
function drawStars(n){for(let i=0;i<n;i++){const xx=(i*97+z*(i%4+1)*.25)%W,yy=(i*53)%(H*.65),r=(i%3+1)*dpr;c.globalAlpha=.35+.55*Math.abs(Math.sin(T*.025+i));c.fillStyle='#fff';c.fillRect(xx,yy,r,r)}c.globalAlpha=1}
function cloud(xx,yy,s,col){c.fillStyle=col;c.beginPath();c.ellipse(xx,yy,90*s,28*s,0,0,7);c.ellipse(xx+65*s,yy-10*s,65*s,32*s,0,0,7);c.fill()}
function drawMapTheme(th){
  const t=T*.01+z*.015;c.save();
  if(th==='sky'){
    c.fillStyle='#49c8ff';c.fillRect(0,0,W,H);c.fillStyle='#fff3a6';c.beginPath();c.arc(W*.82,H*.16,Math.min(W,H)*.07,0,7);c.fill();
    for(let i=0;i<8;i++)cloud(((i*W/7-z*1.5)%(W+260))-130,H*(.16+(i%3)*.12),1,'rgba(255,255,255,.55)');
  }else if(th==='cloud'){
    c.fillStyle='#d8efff';c.fillRect(0,0,W,H);
    for(let i=0;i<7;i++)cloud(((i*W/6-z*.8)%(W+260))-130,H*(.22+(i%2)*.18),1.2,'rgba(255,255,255,.82)');
    c.fillStyle='rgba(80,125,170,.25)';for(let i=0;i<6;i++)c.fillRect((i*W/5-z*.4)%W,H*.58-(i%2)*30,55,H*.42);
  }else if(th==='ufo'){
    c.fillStyle='#07152d';c.fillRect(0,0,W,H);drawStars(95);c.translate(W*.5,H*.25+Math.sin(t)*10);
    c.fillStyle='rgba(62,255,226,.12)';c.beginPath();c.moveTo(-70,25);c.lineTo(-35,230);c.lineTo(35,230);c.lineTo(70,25);c.fill();
    c.fillStyle='#36d9ca';c.beginPath();c.ellipse(0,0,90,30,0,0,7);c.fill();c.fillStyle='#9ffff4';c.beginPath();c.ellipse(0,-8,42,20,0,0,7);c.fill();
  }else if(th==='galaxy'||th==='void'){
    const v=th==='void';c.fillStyle=v?'#040008':'#050016';c.fillRect(0,0,W,H);drawStars(v?120:150);
    c.translate(W*.5,H*(v?.34:.28));c.rotate(v?-t*.08:t*.12);
    c.strokeStyle=v?'rgba(194,77,255,.75)':'rgba(192,106,255,.8)';c.lineWidth=v?9:7;c.beginPath();c.ellipse(0,0,v?210:180,v?65:60,0,0,7);c.stroke();
    c.strokeStyle='rgba(77,224,255,.65)';c.lineWidth=3;c.beginPath();c.ellipse(0,0,v?85:75,v?220:185,0,0,7);c.stroke();
    c.fillStyle=v?'#010006':'#6530d6';c.beginPath();c.arc(0,0,v?75:62,0,7);c.fill();
  }else if(th==='volcano'){
    const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#45100b');g.addColorStop(1,'#080202');c.fillStyle=g;c.fillRect(0,0,W,H);
    c.fillStyle='#241010';c.beginPath();c.moveTo(0,H);c.lineTo(W*.35,H*.25);c.lineTo(W*.5,H*.18);c.lineTo(W*.7,H*.3);c.lineTo(W,H);c.fill();
    c.strokeStyle='#ff4b16';c.lineWidth=10;c.beginPath();c.moveTo(W*.5,H*.2);c.quadraticCurveTo(W*.42,H*.48,W*.5,H*.7);c.stroke();
    for(let i=0;i<18;i++){c.fillStyle=i%2?'#ffb21c':'#ff4b00';c.globalAlpha=.7;c.beginPath();c.arc(W*.5+Math.sin(i*8+t)*W*.18,H*.18+((i*37+T*1.7)%180),2+i%4,0,7);c.fill()}
  }else if(th==='ice'){
    c.fillStyle='#8cecf5';c.fillRect(0,0,W,H);c.fillStyle='#d9fbff';c.beginPath();c.moveTo(0,H);c.lineTo(W*.2,H*.4);c.lineTo(W*.38,H*.68);c.lineTo(W*.58,H*.28);c.lineTo(W*.8,H*.58);c.lineTo(W,H*.35);c.lineTo(W,H);c.fill();
    c.strokeStyle='rgba(30,130,190,.45)';c.lineWidth=5;for(let i=0;i<10;i++){const x0=(i*W/9+z*.2)%W;c.beginPath();c.moveTo(x0,0);c.lineTo(x0-80,H);c.stroke()}
  }else if(th==='cyber'){
    c.fillStyle='#080021';c.fillRect(0,0,W,H);c.strokeStyle='rgba(0,240,255,.22)';c.lineWidth=1;
    for(let y0=H*.18;y0<H;y0+=35){c.beginPath();c.moveTo(0,y0);c.lineTo(W,y0);c.stroke()}
    for(let x0=0;x0<W;x0+=45){c.beginPath();c.moveTo(x0,H*.15);c.lineTo(x0,H);c.stroke()}
    c.strokeStyle='rgba(255,45,255,.35)';c.lineWidth=5;c.beginPath();c.arc(W*.5,H*.35,95,0,7);c.stroke();
    c.strokeStyle='#00f0ff';c.lineWidth=3;c.beginPath();c.arc(W*.5,H*.35,65,0,7);c.stroke();
  }else if(th==='storm'){
    c.fillStyle='#151d3a';c.fillRect(0,0,W,H);
    for(let i=0;i<8;i++)cloud((i*W/7-z*.5)%(W+240)-120,H*.2+(i%3)*55,1.2,'#293153');
    if(Math.sin(T*.09)>.85){c.strokeStyle='#fff16a';c.lineWidth=7;c.beginPath();c.moveTo(W*.56,H*.2);c.lineTo(W*.48,H*.48);c.lineTo(W*.55,H*.47);c.lineTo(W*.42,H*.75);c.stroke()}
    c.strokeStyle='rgba(100,190,255,.35)';c.lineWidth=2;for(let i=0;i<50;i++){const xx=(i*83)%W,yy=(i*47+T*7)%H;c.beginPath();c.moveTo(xx,yy);c.lineTo(xx-7,yy+20);c.stroke()}
  }else{
    const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ff67a9');g.addColorStop(.4,'#a85cff');g.addColorStop(.7,'#36dfff');g.addColorStop(1,'#36f0a0');c.fillStyle=g;c.fillRect(0,0,W,H);
    ['#ff4b4b','#ffd83d','#58ff7d','#53c9ff','#a95cff'].forEach((col,i)=>{c.strokeStyle=col;c.lineWidth=13;c.beginPath();c.arc(W*.5,H*.72,190-i*25,Math.PI,2*Math.PI);c.stroke()});
  }
  c.restore();
}
function draw(){
  const L=LV[lv],inf=lv==LV.length-1,h=(L[2]+(inf?z*.15:0))%360,th=(L[3]+(inf?z*.15:0))%360;
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;
  c.save();if(shake>.5)c.translate((Math.random()-.5)*shake*dpr,(Math.random()-.5)*shake*dpr);
  gen(z+45|0);
  drawMapTheme(L[7]);
  const sg2=c.createRadialGradient(W*.5,H*.36,0,W*.5,H*.36,H*.32);
  sg2.addColorStop(0,`hsla(${h+30},100%,88%,.18)`);sg2.addColorStop(1,`hsla(${h+30},100%,70%,0)`);
  c.fillStyle=sg2;c.fillRect(0,0,W,H);
  const r0=z+40|0;
  for(let r=r0;r>z;r--){
    const d=r-z;c.globalAlpha=Math.min(1,(41-d)/10);
    for(let pass=2;pass--;)for(let i=7;i--;){
      const cell=rows[r][i];if(!cell)continue;
      const[ax,ay]=P(i-3.5,0,d),[bx,by]=P(i-2.5,0,d),[ex,ey]=P(i-3.5,0,d+1),[fx,fy]=P(i-2.5,0,d+1),hh=(th+(r>>6)*40)%360,par=(r+i)&1;
      if(pass){hsl(hh,60,32+par*9);c.fillRect(ex,ey,fx-ex,(40-d)/30*H)}
      else{
        hsl(hh,60,12+par*5);c.fillRect(ax,ay,bx-ax,(40-d)/30*H);
        hsl(hh,65,58+par*20);c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.lineTo(fx,fy);c.lineTo(ex,ey);c.closePath();c.fill();
        if(cell==2){
          const[cx,cy,k]=P(i-3,.55+.08*Math.sin(T*.1+r),d),rad=k*.16;
          c.fillStyle='#ffd23f';c.beginPath();c.ellipse(cx,cy,Math.max(rad*.12,rad*Math.abs(Math.cos(T*.06+r))),rad,0,0,7);c.fill();
          c.strokeStyle='#fff6b0';c.lineWidth=2*dpr;c.stroke();
        }
      }
    }
  }
  c.globalAlpha=1;
  if(st!=='menu'){
    if(y>=0&&rows[z+3|0][Math.round(x+3)]){const[a,b,k]=P(x,0,3);c.fillStyle='rgba(0,0,0,.45)';c.beginPath();c.ellipse(a,b,k/4,k/9,0,0,7);c.fill()}
    const[a,b,k]=P(x,y+.35,3),R=k*.33,[c1,c2]=skc();
    drawBallFX(a,b,k,R,c1);
    c.globalAlpha=.25;c.fillStyle=c1;c.beginPath();c.arc(a,b,R*1.5,0,7);c.fill();c.globalAlpha=1;
    const bg=c.createRadialGradient(a-R*.35,b-R*.4,R*.08,a,b,R);
    bg.addColorStop(0,'#fff');bg.addColorStop(.3,c1);bg.addColorStop(1,c2);
    c.fillStyle=bg;c.beginPath();c.arc(a,b,R,0,7);c.fill();
    c.globalAlpha=.35+.35*(Math.sin(T*.09)+1)/2;c.fillStyle='#fff';c.beginPath();c.arc(a-R*.28,b-R*.32,R*.16,0,7);c.fill();
    c.globalAlpha=.8;c.lineWidth=Math.max(1,k*.025);
    const th2=SK[S.skin][4];
    if(th2==='neon'){c.strokeStyle='#ff35ff';c.beginPath();c.arc(a,b,R*.72,T*.03,T*.03+Math.PI*1.35);c.stroke()}
    else if(th2==='galaxy'){c.fillStyle='#fff';for(let i=0;i<4;i++){const an=T*.03+i*1.7;c.beginPath();c.arc(a+Math.cos(an)*R*.55,b+Math.sin(an)*R*.55,R*.055,0,7);c.fill()}}
    else if(th2==='ice'){c.strokeStyle='#fff';c.beginPath();c.moveTo(a-R*.45,b);c.lineTo(a,b-R*.45);c.lineTo(a+R*.45,b);c.stroke()}
    else if(th2==='void'){c.strokeStyle='#e0a8ff';c.beginPath();c.arc(a,b,R*.68,-T*.04,T*.04+Math.PI*1.5);c.stroke()}
  }
  for(const p of parts){c.globalAlpha=p.l/p.m;c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.s*(p.l/p.m),0,7);c.fill()}
  c.globalAlpha=1;c.restore();
}
let last=0,acc=0;
function loop(t){requestAnimationFrame(loop);acc=Math.min(acc+t-last,100);last=t;while(acc>=16.67){stepG();acc-=16.67}if(st!=='menu')draw()}
requestAnimationFrame(loop);

// ---------- écrans ----------
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id))}
function banner(t){const b=$('bn');b.textContent=t;b.classList.remove('go');void b.offsetWidth;b.classList.add('go')}
function resetWorld(){rows=[];gap=0;sx=sw=3;x=y=z=vy=tx=0;falling=0;parts=[]}
function start(l){
  stopMenuSound();
  lv=l;resetWorld();run=0;jb=0;st='play';show('');$('hud').classList.add('on');
  $('bf').style.width='0';$('sc').textContent='0';$('cn').textContent=S.coins;
  if(!S.mute)music.play().catch(()=>{});
  banner('Niveau '+(l+1)+' · '+LV[l][0]);
  updateMobileUI();
  if(isTouch)setTimeout(showMobileHint,500);
}
function endRun(w){
  st=w?'win':'over';const bonus=w?lv*15+30:0;
  S.coins+=run+bonus;const d=z|0;if(d>S.best)S.best=d;
  if(w)S.unl=Math.max(S.unl,Math.min(lv+2,LV.length));
  save();$('hud').classList.remove('on');music.pause();updateMobileUI();
  if(w){$('wc').textContent=run+bonus;$('nx').style.display=lv<LV.length-1?'flex':'none';sfx('w');burst(60,'#ffd23f',10,1);show('win')}
  else{
    $('fs').textContent=d;$('fc').textContent=run;$('fb').textContent=S.best;
    if(!S.mute){gameOverSound.currentTime=0;gameOverSound.play().catch(()=>{})}
    show('over');
  }
}
function refreshMenu(){
  const s=SK[S.skin],r=document.documentElement.style;
  r.setProperty('--c1',s[2]);r.setProperty('--c2',s[3]);
  $('mb').textContent=S.best;$('mc').textContent=S.coins;$('menuUnlocked').textContent=S.unl;$('mLv').textContent=S.unl;
  $('gear').textContent=S.mute?'🔇':'⚙';
}
function menu(){
  st='menu';music.pause();stopMenuSound();playMenuSound();
  lv=Math.min(lv,S.unl-1);resetWorld();$('hud').classList.remove('on');
  refreshMenu();show('menu');updateMobileUI();resetPad();
}
function buildLevels(){
  $('lg2').innerHTML=LV.map((l,i)=>`<button class="card ${i<S.unl?'':'lock'}" data-l="${i}"><b>${i<S.unl?i+1:'<svg class="i"><use href="#i-lock"/></svg>'}</b>${l[0]}</button>`).join('');
}
function buildShop(){
  $('sc2').textContent=S.coins;
  $('sg').innerHTML=SK.map((s,i)=>{
    const own=S.owned.includes(i),th=s[4];
    const bg=th==='rainbow'?'conic-gradient(#ff4b4b,#ffe74b,#50ff70,#48aaff,#a64bff,#ff4b4b)'
      :th==='neon'?`radial-gradient(circle at 35% 30%,#fff,${s[2]} 25%,#ff35ff 55%,${s[3]})`
      :th==='galaxy'?`radial-gradient(circle at 35% 30%,#fff,${s[2]} 12%,#713cff 42%,${s[3]})`
      :`radial-gradient(circle at 35% 30%,#fff,${s[2]} 35%,${s[3]})`;
    return `<button class="card ${S.skin==i?'sel':''} ${own?'':'lock'}" data-s="${i}"><div class="orb" style="background:${bg}"></div>${s[0]}<br>${own?(S.skin==i?'Équipée':'Choisir'):`<svg class="i"><use href="#i-coin"/></svg> ${s[1]}`}</button>`;
  }).join('');
}
function togglePause(){
  if(st==='play'){st='pause';music.pause();show('pauseS')}
  else if(st==='pause'){st='play';if(!S.mute)music.play().catch(()=>{});show('')}
  updateMobileUI();if(st!=='play')resetPad();
}
const vibrate=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
let loadT=null;
function act(a){
  if(a=='play'){
    if(st==='menu'){
      if(loadT)clearTimeout(loadT);
      initA();stopMenuSound();show('loadingScreen');
      loadT=setTimeout(()=>{loadT=null;start(lv)},1350);
    }else start(lv);
    vibrate(15);
  }
  else if(a=='levels'){buildLevels();show('levels')}
  else if(a=='shop'){buildShop();show('shop')}
  else if(a=='menu')menu();
  else if(a=='retry'){start(lv);vibrate(15)}
  else if(a=='next'){start(lv+1);vibrate(15)}
  else if(a=='pause'){togglePause();vibrate(8)}
  else if(a=='snd'){
    S.mute^=1;setVol();save();
    $('sndU').setAttribute('href',S.mute?'#i-mute':'#i-snd');
    if(S.mute){stopMenuSound();music.pause()}
    else if(st==='menu')playMenuSound();else if(st==='pause'){}
    refreshMenu();
  }
  else if(a=='prize'){
    const d=new Date().toDateString();
    if(S.gift!==d){S.gift=d;S.coins+=25;save();sfx('c');banner('🎁 Cadeau du jour : +25 pièces !');refreshMenu()}
    else banner('Reviens demain pour un nouveau cadeau !');
  }
  else if(a=='rank'||a=='rec')banner('🏆 Record : '+S.best+' m');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a],[data-l],[data-s]');if(!b)return;sfx('u');
  if(b.dataset.a)act(b.dataset.a);
  else if(b.dataset.l!==undefined){const l=+b.dataset.l;if(l<S.unl){lv=l;act('play')}}
  else{
    const i=+b.dataset.s,s=SK[i];
    if(S.owned.includes(i))S.skin=i;
    else if(S.coins>=s[1]){S.coins-=s[1];S.owned.push(i);S.skin=i;sfx('c')}
    save();buildShop();refreshMenu();
  }
});
$('sndU').setAttribute('href',S.mute?'#i-mute':'#i-snd');

// ---------- contrôles ----------
let dn=null;
addEventListener('pointerdown',e=>{
  initA();
  if(st!=='play'||e.target.closest('button,#movePad'))return;
  dn={t:performance.now(),lx:e.clientX,m:0};
  if(e.pointerType==='mouse')jb=10;
});
addEventListener('pointermove',e=>{
  if(st!=='play')return;
  if(e.pointerType==='mouse')tx=(e.clientX/innerWidth-.5)*8;
  else if(dn){const d=e.clientX-dn.lx;tx+=d/innerWidth*9;dn.m+=Math.abs(d);dn.lx=e.clientX}
});
addEventListener('pointerup',e=>{
  if(dn&&e.pointerType!=='mouse'&&dn.m<14&&performance.now()-dn.t<300)jb=10;
  dn=null;
});
addEventListener('keydown',e=>{
  initA();const k=e.key;
  if(k=='a'||k=='ArrowLeft')keys.l=1;
  if(k=='d'||k=='ArrowRight')keys.r=1;
  if(k==' '||k=='ArrowUp'||k=='w'){jb=10;e.preventDefault()}
  if(k=='p'||k=='Escape')togglePause();
  if(k=='r'&&(st=='play'||st=='over'))start(lv);
});
addEventListener('keyup',e=>{const k=e.key;if(k=='a'||k=='ArrowLeft')keys.l=0;if(k=='d'||k=='ArrowRight')keys.r=0});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(st==='play')togglePause();resetPad()}});

// ---------- contrôles mobiles ----------
const mobileUI=$('mobileControls'),movePad=$('movePad'),padKnob=$('padKnob'),jumpBtn=$('jumpBtn'),mobileHint=$('mobileHint');
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
let padPointer=null,pcx=0,pcy=0;const PR=43;
function updateMobileUI(){mobileUI.classList.toggle('active',isTouch&&st==='play')}
function showMobileHint(){
  try{if(localStorage.getItem('skyd_hint'))return;localStorage.setItem('skyd_hint','1')}catch(e){}
  mobileHint.classList.add('show');setTimeout(()=>mobileHint.classList.remove('show'),3200);
}
function resetPad(){padKnob.style.transform='translate(-50%,-50%)';keys.l=keys.r=0;tx=x}
function calcPad(){const r=movePad.getBoundingClientRect();pcx=r.left+r.width/2;pcy=r.top+r.height/2}
function updatePad(cx,cy){
  let dx=cx-pcx,dy=cy-pcy;const dist=Math.hypot(dx,dy);
  if(dist>PR){dx*=PR/dist;dy*=PR/dist}
  const nx=dx/PR,ny=dy/PR;
  padKnob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
  keys.l=nx<-.12?1:0;keys.r=nx>.12?1:0;
  if(ny<-.65)jb=4;
}
movePad.addEventListener('pointerdown',e=>{
  if(st!=='play')return;e.preventDefault();padPointer=e.pointerId;
  movePad.setPointerCapture(e.pointerId);calcPad();updatePad(e.clientX,e.clientY);vibrate(7);
});
movePad.addEventListener('pointermove',e=>{if(e.pointerId!==padPointer||st!=='play')return;e.preventDefault();updatePad(e.clientX,e.clientY)});
const endPad=e=>{if(e.pointerId!==padPointer)return;padPointer=null;resetPad()};
movePad.addEventListener('pointerup',endPad);movePad.addEventListener('pointercancel',endPad);
movePad.addEventListener('lostpointercapture',()=>{padPointer=null;resetPad()});
jumpBtn.addEventListener('pointerdown',e=>{e.preventDefault();if(st!=='play')return;jb=10;jumpBtn.classList.add('pressed');vibrate(12);sfx('j')});
const jr=e=>{e.preventDefault();jumpBtn.classList.remove('pressed')};
['pointerup','pointercancel','pointerleave'].forEach(ev=>jumpBtn.addEventListener(ev,jr));
$('mobilePause').addEventListener('click',e=>{e.preventDefault();togglePause();vibrate(8)});
document.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='touch'||e.target.closest('button,#movePad'))return;
  const f=$('touchFeedback');f.style.left=e.clientX+'px';f.style.top=e.clientY+'px';
  f.classList.remove('show');void f.offsetWidth;f.classList.add('show');
});
addEventListener('resize',()=>{if(st==='play')calcPad()});
addEventListener('orientationchange',()=>setTimeout(calcPad,250));

// ---------- démarrage ----------
menu();
</script>
